[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }

_.file = ["{{config_root}}/.secrets.env"]
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
FLATE_REGISTRY_CONFIG = "{{env.HOME}}/.config/flate/registry.json"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
BOOTSTRAP_DIR = "{{config_root}}/kubernetes/bootstrap"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
SCRIPTS_DIR = "{{config_root}}/kubernetes/bootstrap/scripts"
TALOS_DIR = "{{config_root}}/kubernetes/talos"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
gum = "2.0.2"
helm = "4.3.1"
just = "1.59.0"
kubectl = "1.37.1"
lefthook = "2.2.2"
jq = "1.8.2"
oxfmt = "0.74.0"
python = "3.14.7"
shellcheck = "0.11.0"
talos = "1.14.4"
uv = "0.13.5"
yq = "4.54.1"
zizmor = "1.31.1"
"pipx:ansible-core" = "latest"
"github:home-operations/flate" = "v0.6.5"
"github:home-operations/kopiur" = "0.10.16"
"github:home-operations/yamlls" = "0.3.2"
"aqua:mitsuhiko/minijinja" = "3.0.2"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.103.0"                  # GitHub CLI
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
