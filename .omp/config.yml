# home-ops repo rules. Host-wide policy lives in the Paseo image:
# ~/.omp/agent/RULES.md and ~/.omp/agent/hooks/pre/secret-guard.ts.
# Ordered, first match wins; project rules are evaluated before host rules.
bash:
  patterns:
    - match: "git push --force*"
      approval: deny
    - match: "git push -f*"
      approval: deny
    - match: "talosctl read*"
      approval: deny
    - match: "kubectl exec*"
      approval: deny
    - match: "kubectl cp*"
      approval: deny
    - match: "helm get values*"
      approval: deny
    - match: "helm get manifest*"
      approval: deny
    - match: "*get secret *-o yaml*"
      approval: deny
    - match: "*get secrets *-o yaml*"
      approval: deny
    - match: "*get secret *-o jsonpath*"
      approval: deny
    - match: "*get secrets *-o jsonpath*"
      approval: deny
    - match: "*get secret *-o go-template*"
      approval: deny
    - match: "*get secrets *-o go-template*"
      approval: deny
    - match: "git add*"
      approval: allow
    - match: "git commit*"
      approval: allow
    - match: "git push*"
      approval: allow
    - match: "git switch -c*"
      approval: allow
    - match: "git checkout -b*"
      approval: allow
    - match: "gh pr create*"
      approval: allow
    - match: "just *"
      approval: allow
