# home-ops repo rules. Host-wide policy lives in the Paseo image:
# ~/.omp/agent/RULES.md and ~/.omp/agent/hooks/pre/secret-guard.ts.
# Ordered, first match wins; project rules are evaluated before host rules.
# OMP imports MCP servers from .opencode/opencode.json; .omp/mcp.json defines
# litellm-homelab and memini natively so OMP keeps them if OpenCode is removed.
# Native .omp/mcp.json wins over imported OpenCode entries; keep both in sync.
bash:
  patterns:
    - match: "git push --force* main*"
      approval: deny
    - match: "git push -f* main*"
      approval: deny
    - match: "git push* main* --force*"
      approval: deny
    - match: "git push* +main*"
      approval: deny
    - match: "talosctl*read*kubeconfig*"
      approval: deny
    - match: "talosctl*read*cert*"
      approval: deny
    - match: "talosctl*read*.key*"
      approval: deny
    - match: "talosctl*read*secret*"
      approval: deny
    - match: "talosctl*read*talosconfig*"
      approval: deny
    - match: "talosctl*read*/var/lib/*"
      approval: deny
    - match: "kubectl cp*"
      approval: deny
    - match: "kubectl exec*-- env*"
      approval: deny
    - match: "kubectl exec*-- printenv*"
      approval: deny
    - match: "kubectl exec*-- export*"
      approval: deny
    - match: "kubectl exec*-- cat*"
      approval: deny
    - match: "kubectl exec*-- sh*"
      approval: deny
    - match: "kubectl exec*-- bash*"
      approval: deny
    - match: "kubectl exec*-- python*"
      approval: deny
    - match: "kubectl exec*-- *kubeconfig*"
      approval: deny
    - match: "kubectl exec*-- *talosconfig*"
      approval: deny
    - match: "kubectl exec*-- *signing_key*"
      approval: deny
    - match: "kubectl exec*-- */var/run/secrets/*"
      approval: deny
    - match: "helm get values*"
      approval: deny
    - match: "helm get manifest*"
      approval: deny
    - match: "*get secret *-o yaml*"
      approval: deny
    - match: "*get secrets *-o yaml*"
      approval: deny
    - match: "*get secret *-o jsonpath*"
      approval: deny
    - match: "*get secrets *-o jsonpath*"
      approval: deny
    - match: "*get secret *-o go-template*"
      approval: deny
    - match: "*get secrets *-o go-template*"
      approval: deny
    - match: "git push --force-with-lease*"
      approval: allow
    - match: "git push --force*"
      approval: allow
    - match: "git push -f*"
      approval: allow
    - match: "git add*"
      approval: allow
    - match: "git commit*"
      approval: allow
    - match: "git push*"
      approval: allow
    - match: "git switch -c*"
      approval: allow
    - match: "git checkout -b*"
      approval: allow
    - match: "gh pr create*"
      approval: allow
    - match: "just *"
      approval: allow
