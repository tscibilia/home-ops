---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cluster-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        SECRET_DOMAIN: "{{ .SECRET_DOMAIN }}"
        CEAPP_DOMAIN: "{{ .CEAPP_DOMAIN }}"
        TIMEZONE: "{{ .TIMEZONE }}"
        TAILSCALE_MAGICDNS: "{{ .TS_OPER_MAGICDNS }}"
        KOPIA_BUCKET: "{{ .B2_KOPIA_BUCKET }}"
  dataFrom:
    - extract:
        key: /kubernetes/cluster-secrets
    - extract:
        key: /network/tailscale/operator
    - extract:
        key: /cloud-providers/b2-creds
---
# Reusable password generators, one per length. An app references one from
# `dataFrom.sourceRef.generatorRef` to seed a credential instead of a manual task.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: password10
spec:
  length: 10
  allowRepeat: true
  noUpper: false
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: password32
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: password64
spec:
  length: 64
  allowRepeat: true
  noUpper: false
  symbols: 0
