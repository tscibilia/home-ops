---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: "${APP}"
spec:
  extAuth:
    failOpen: false
    headersToExtAuth: ["cookie", "x-forwarded-proto", "x-forwarded-host", "x-forwarded-uri"]
    http:
      backendRefs:
        - name: tinyauth
          namespace: security
          port: 3000
      path: /api/auth/envoy
      headersToBackend:
        [
          "set-cookie",
          "remote-user",
          "remote-name",
          "remote-email",
          "remote-groups",
          "remote-sub",
          "authorization",
        ]
  targetRefs:
    - group: "${EXT_AUTH_GROUP:-gateway.networking.k8s.io}"
      kind: "${EXT_AUTH_KIND:-HTTPRoute}"
      name: "${EXT_AUTH_TARGET:-${APP}}"
