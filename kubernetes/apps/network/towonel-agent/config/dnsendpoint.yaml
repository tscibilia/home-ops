---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: towonel-agent
spec:
  endpoints:
    - dnsName: twnl.${SECRET_DOMAIN}
      recordType: A
      recordTTL: 60
      targets: &target
        - ${TOWONEL_VPS_IP}
    - dnsName: external.${SECRET_DOMAIN}
      recordType: A
      recordTTL: 60
      targets: *target
      # DNS-only (global default): Cloudflare's proxy caps request bodies at
      # 100MB, which breaks large Immich uploads.
    - dnsName: external.${CEAPP_DOMAIN}
      recordType: A
      recordTTL: 60
      targets: *target
