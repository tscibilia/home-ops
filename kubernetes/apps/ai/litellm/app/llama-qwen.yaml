---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-qwen
spec:
  # Refer to [Cliffs](https://github.com/noonghunna/club-3090/blob/master/docs/CLIFFS.md) a/k/a/ sudden VRAM/OOM failure, for Qwen3.x on a single GPU.
  # Refer to [Qwen3.8-27B club-3090](https://github.com/noonghunna/club-3090/blob/master/models/qwen3.8-27b/llama-cpp/compose/single/unsloth-iq4nl/q8kv.yml) for more config details.
  source: hf://unsloth/Qwen3.8-27B-GGUF
  files:
    - Qwen3.8-27B-UD-Q4_K_XL.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      layers: 99
# ┌─────────────────────────────────┬───────────────┬──────────────┐
# │              Item               │ Now (Q4_K_XL) │ With Q5_K_XL │
# ├─────────────────────────────────┼───────────────┼──────────────┤
# │ Model weights                   │ 17.6 GB       │ 20.9 GB      │
# ├─────────────────────────────────┼───────────────┼──────────────┤
# │ Vision part (mmproj-F16)        │ ~1 GB         │ ~1 GB        │
# ├─────────────────────────────────┼───────────────┼──────────────┤
# │ KV cache (163840 context, q4_0) │ ~4 GB         │ ~4 GB        │
# ├─────────────────────────────────┼───────────────┼──────────────┤
# │ Scratch (flash attention)       │ ~1 GB         │ ~1 GB        │
# ├─────────────────────────────────┼───────────────┼──────────────┤
# │ Total                           │ ~23.6 GB ✅   │ ~26.9 GB ❌  │
# └─────────────────────────────────┴───────────────┴──────────────┘
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-qwen
spec:
  modelRef: llama-qwen
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711@sha256:34fb4d3f822d3270fd780a9a28900ad5c0adfd86bbc5e9ec4eb84a53aeb743d3
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 3600
  # replicas is deliberately unset: ModelPool/ai3090-slot patches it to claim or
  # release the GPU. Declaring it here would make Flux revert the pool hourly.
  priority: high
  runtimeClassName: nvidia
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 163840
  batchSize: 2048
  uBatchSize: 512
  flashAttention: true
  cacheTypeK: q4_0
  cacheTypeV: q4_0
  jinja: true
  parallelSlots: 1
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  resources:
    gpu: 1
    cpu: 100m
    memory: 20Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --sleep-idle-seconds
    - "3600"
    - --alias
    - huggingface/Qwen3.8-27B
    - --cont-batching
    - --spec-type
    - draft-mtp
    - --spec-draft-p-min
    - "0.75"
    - --spec-draft-n-max
    - "2"
    - --spec-draft-type-k
    - q4_0
    - --spec-draft-type-v
    - q4_0
    - -sps
    - "0.75"
    - --cache-prompt
    # Host RAM for saved prompt states, not VRAM. Must stay well under the 20Gi
    # pod limit: the mmapped GGUF adds ~9Gi of (reclaimable) page cache on top.
    - --cache-ram
    - "12288"
    - --kv-unified
    # Qwen3.8 model card, thinking row (instruct row is sent per-request by the caller)
    - --temp
    - "1.0"
    - --top-k
    - "20"
    - --top-p
    - "0.95"
    - --min-p
    - "0.0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    - --mmap
    # preserve_thinking replays every prior turn's trace; with Qwen3.8's xhigh
    # default that compounds until the window is gone. Callers override per request.
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
