---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-qwen
spec:
  # Refer to [Cliffs](https://github.com/noonghunna/club-3090/blob/master/docs/CLIFFS.md) a/k/a/ sudden VRAM/OOM failure, for Qwen3.x on a single GPU.
  # Refer to [Qwen3.8-27B club-3090](https://github.com/noonghunna/club-3090/blob/master/models/qwen3.8-27b/llama-cpp/compose/single/unsloth-iq4nl/q8kv.yml) for more config details.
  source: hf://unsloth/Qwen3.8-27B-GGUF
  files:
    - Qwen3.8-27B-UD-Q4_K_S.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_S
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      layers: 99
# ┌─────────────────────────────────┬─────────────────┬─────────────────┬─────────────────┐
# │              Item               │ Now (XL, q4 KV) │ XL + q8 KV¹     │ K_S + q8 KV     │
# ├─────────────────────────────────┼─────────────────┼─────────────────┼─────────────────┤
# │ Context                         │ 163840          │ 163840          │ 131072          │
# ├─────────────────────────────────┼─────────────────┼─────────────────┼─────────────────┤
# │ Model weights                   │ 17.6 GB         │ 17.6 GB         │ 15.4 GB         │
# ├─────────────────────────────────┼─────────────────┼─────────────────┼─────────────────┤
# │ Vision part (mmproj-F16)        │ ~1 GB           │ ~1 GB           │ ~1 GB           │
# ├─────────────────────────────────┼─────────────────┼─────────────────┼─────────────────┤
# │ KV cache                        │ ~4 GB           │ ~4 GB + ~4 RAM  │ ~6.3 GB         │
# ├─────────────────────────────────┼─────────────────┼─────────────────┼─────────────────┤
# │ Scratch (flash attention)       │ ~1 GB           │ ~1 GB           │ ~1 GB           │
# ├─────────────────────────────────┼─────────────────┼─────────────────┼─────────────────┤
# │ Total                           │ ~23.6 GB ✅     │ ~27.6 GB ⚠      │ ~23.7 GB ✅     │
# └─────────────────────────────────┴─────────────────┴─────────────────┴─────────────────┘
# ¹ q8_0 ≈ 50 KiB/token. XL at 163840 ctx exceeds VRAM by ~3.6 GiB;
#   GGML_CUDA_ENABLE_UNIFIED_MEMORY=1 spills it to RAM at ~100 ms/token per ~2 GiB
#   (Windows does this invisibly: System Memory Fallback, on by default).
# Reference: https://www.youtube.com/watch?v=hg26j0erUSo
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-qwen
spec:
  modelRef: llama-qwen
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10731@sha256:22684334edfce1e33db30924aade61ea57c898c37d26067b9d914979f86d2278
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 3600
  # replicas is deliberately unset: ModelPool/ai3090-slot patches it to claim or
  # release the GPU. Declaring it here would make Flux revert the pool hourly.
  priority: high
  runtimeClassName: nvidia
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 131072
  batchSize: 2048
  uBatchSize: 512
  flashAttention: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  jinja: true
  parallelSlots: 1
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  resources:
    gpu: 1
    cpu: 100m
    memory: 20Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --sleep-idle-seconds
    - "3600"
    - --alias
    - huggingface/Qwen3.8-27B
    - --cont-batching
    - --spec-type
    - draft-mtp
    - --spec-draft-p-min
    - "0.75"
    - --spec-draft-n-max
    - "2"
    - --spec-draft-type-k
    - q4_0
    - --spec-draft-type-v
    - q4_0
    - -sps
    - "0.75"
    - --cache-prompt
    # Host RAM for saved prompt states, not VRAM. Must stay well under the 20Gi
    # pod limit: the mmapped GGUF adds ~9Gi of (reclaimable) page cache on top.
    - --cache-ram
    - "12288"
    - --kv-unified
    # Qwen3.8 model card, thinking row (instruct row is sent per-request by the caller)
    - --temp
    - "1.0"
    - --top-k
    - "20"
    - --top-p
    - "0.95"
    - --min-p
    - "0.0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    - --mmap
    # preserve_thinking replays every prior turn's trace; with Qwen3.8's xhigh
    # default that compounds until the window is gone. Callers override per request.
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
