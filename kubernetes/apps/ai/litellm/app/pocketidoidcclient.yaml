---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: litellm
spec:
  name: LiteLLM
  callbackUrls:
    - "https://${APP}.${SECRET_DOMAIN}/sso/callback"
  launchUrl: "https://${APP}.${SECRET_DOMAIN}/"
  logo:
    logoUrl: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/litellm.webp"
  pkceEnabled: false
  # No instanceSelector: the PocketIDInstance carries no app.kubernetes.io/name
  # label (verified live — only Flux's kustomize.toolkit.fluxcd.io/* labels are
  # present), so any matchLabels selector here matches nothing and the client
  # never gets a secret. There is exactly one PocketIDInstance in this cluster;
  # the operator's default-instance fallback (proven working via pangolin's
  # client) is what actually resolves this.
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-family
      namespace: security
  secret:
    enabled: true
    name: litellm-oidc-secret
    keys:
      clientID: GENERIC_CLIENT_ID
      clientSecret: GENERIC_CLIENT_SECRET
      authorizationUrl: GENERIC_AUTHORIZATION_ENDPOINT
      tokenUrl: GENERIC_TOKEN_ENDPOINT
      userinfoUrl: GENERIC_USERINFO_ENDPOINT
