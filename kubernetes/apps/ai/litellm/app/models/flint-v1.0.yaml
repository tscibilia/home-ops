---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name flint-v1.0
spec:
  # Recursive's free coding model on OpenRouter: $0 in/$0 out. One provider
  # serves it (Recursive itself), so the endpoint can disappear with no notice —
  # same failure as cohere/north-mini-code:free on 2026-11-20.
  modelName: *name
  params:
    model: openai/recursive/flint-v1.0:free
    apiBase: https://openrouter.ai/api/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENROUTER_API_KEY
  info:
    mode: chat
    maxTokens: 32768
    maxInputTokens: 262144
    maxOutputTokens: 235929
    supportsFunctionCalling: true
    supportsPromptCaching: false
    supportsVision: false
    extra:
      supports_reasoning: true
      # Free promo: no per-token charge.
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_read_input_token_cost: 0.0
