---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name deepseek-v4.1-flash
spec:
  # Sparse MoE model that activates 8B/in & 16B/out from 552B parameter backbone. This is the
  # re-post-trained 2026-10-17 revision (deepseek-v4.1-flash-1017), rumored to beat Kimi K3.
  modelName: *name
  params:
    model: openai/deepseek/deepseek-v4.1-flash-1017
    apiBase: https://openrouter.ai/api/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENROUTER_API_KEY
    additional:
      extra_body:
        provider:
          # cheapest first by $/M input: morph $0.057, open-inference $0.07, deepinfra $0.098.
          # Only deepinfra (51% off, $0.098/$0.294) satisfies the $0.14/$0.40 cap, so it serves.
          order: ["morph", "open-inference", "deepinfra"]
          # allow fall back at or below $0.14/$0.40
          allow_fallbacks: true
          max_price:
            prompt: 0.14
            completion: 0.40
  info:
    mode: chat
    maxTokens: 131072
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      supports_reasoning: true
      # deepinfra via OpenRouter on -1017 (51% off): $0.098 in / $0.294 out / $0.00294 cached read
      input_cost_per_token: 0.0000000980
      cache_read_input_token_cost: 0.00000000294
      output_cost_per_token: 0.0000002940
