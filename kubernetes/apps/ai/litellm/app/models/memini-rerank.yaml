---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name memini-rerank
spec:
  modelName: *name
  params:
    model: infinity/memini-rerank
    apiBase: http://memini-rerank.ai.svc.cluster.local:8080/v1
    apiKeyRef:
      name: litellm-secret
      key: MEMINI_RERANK_API_KEY
  info:
    mode: rerank
    extra:
      input_cost_per_token: 0.0000000120
      output_cost_per_token: 0.0000000500
