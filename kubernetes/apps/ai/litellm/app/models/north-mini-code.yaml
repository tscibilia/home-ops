---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name north-mini-code
spec:
  # Cohere's free coding model on OpenRouter: $0 in/$0 out while the promo runs.
  # No client contract to satisfy — a plain OpenRouter key is enough. Free endpoints
  # are rate-limited per OpenRouter account; when the promo ends the failure is 429
  modelName: *name
  params:
    model: openai/cohere/north-mini-code:free
    apiBase: https://openrouter.ai/api/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENROUTER_API_KEY
  info:
    mode: chat
    maxTokens: 32768
    maxInputTokens: 256000
    maxOutputTokens: 64000
    supportsFunctionCalling: true
    supportsPromptCaching: false
    supportsVision: false
    extra:
      supports_reasoning: true
      # Free promo: no per-token charge.
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_read_input_token_cost: 0.0
