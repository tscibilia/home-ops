---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        # App
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        PROXY_ADMIN_ID: "{{ .LITELLM_ADMIN_USER }}"
        # API
        LLAMA_API_KEY: "{{ .LLAMA_API_KEY }}"
        MEMINI_EMBED_API_KEY: "{{ .LITELLM_MEMINI_API_KEY }}"
        MEMINI_RERANK_API_KEY: "{{ .LITELLM_MEMINI_API_KEY }}"
        NVIDIA_API_KEY: "{{ .NVIDIA_API_KEY }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY }}"
        POOLSIDE_API_KEY: "{{ .POOLSIDE_API_KEY }}"
        # SSO
        GENERIC_SCOPE: openid profile email groups
  dataFrom:
    - extract:
        key: /ai/litellm
    - extract:
        key: /ai/llama-cpp
    - extract:
        key: /cloud-providers/ai-apis
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  # Seeds the CNPG role password so it never has to be created by hand. The
  # generator is stateless, so refreshInterval "0" is what pins the value.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
