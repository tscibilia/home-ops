---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm-non_root:v1.108.1@sha256:bf26c5e4e18375d407fa29c78071293bba6122b886434e454ded05e1d86a8bd6
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
    disable_env_credential_login: true
  litellmSettings:
    success_callback: ["prometheus"]
    failure_callback: ["prometheus"]
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    # hermes sends reasoning_effort on every request; only qwen advertises it.
    # Per-model dropParams lost — every non-qwen model 400s without this.
    drop_params: true
    request_timeout: 600
    set_verbose: false
    require_auth_for_metrics_endpoint: false
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 2
    timeout: 600
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: PROXY_BASE_URL
      value: "https://${APP}.${SECRET_DOMAIN}"
    - name: REDIS_HOST
      value: dragonfly-cluster.database.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-pguser-secret
          key: uri
    # Jev decision model — TypeSafe's System One API, reached through OpenRouter.
    # litellm's typesafe provider appends /v1/systemone to the base, so the base
    # stops at /api to land on OpenRouter's /api/v1/systemone.
    - name: TYPESAFE_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: OPENROUTER_API_KEY
    - name: TYPESAFE_API_BASE
      value: https://openrouter.ai/api
  envFrom:
    - secretRef:
        name: litellm-secret
    - secretRef:
        name: litellm-oidc-secret
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames: ["${APP}.${SECRET_DOMAIN}"]
    parentRefs:
      - name: envoy-external
        namespace: network
