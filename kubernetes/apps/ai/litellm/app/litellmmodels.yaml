    extra:
      input_cost_per_token: 0.0000000120
      output_cost_per_token: 0.0000000500
# deepseek-v4-flash-free removed from OpenCode Zen ~08/21/26
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name deepseek-v4-flash
spec:
  modelName: *name
  params:
    model: openai/deepseek/deepseek-v4-flash
    apiBase: https://openrouter.ai/api/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENROUTER_API_KEY
    additional:
      extra_body:
        provider:
          # Zen ~3x this output cost and adds peak/off-peak pricing.
          order: ["deepinfra"]
          # DeepInfra's shared pool 429s under load; fall back, but only to hosts
          # at or below its rate. USD per 1M tokens, matched to info.extra below.
          allow_fallbacks: true
          max_price:
            prompt: 0.09
            completion: 0.18
  info:
    mode: chat
    maxTokens: 131072
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      supports_reasoning: true
      # DeepInfra via OpenRouter: $0.09 in / $0.18 out / $0.016 cached read only
      input_cost_per_token: 0.0000000900
      cache_read_input_token_cost: 0.0000000160
      output_cost_per_token: 0.0000001800
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
