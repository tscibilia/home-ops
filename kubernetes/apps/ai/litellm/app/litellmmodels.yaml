---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name qwen-local
spec:
  modelName: *name
  params:
    model: openai/Qwen3.8-27B
    # Router, not the service: naming the model is what wakes it when comfyui
    # holds the slot. The backend's displayName keeps `model` unchanged.
    apiBase: http://ai3090-router-router-proxy.ai.svc.cluster.local:8080/v1
    apiKeyRef:
      name: litellm-secret
      key: LLAMA_API_KEY
    additional:
      # Keys under `additional` are copied into litellm_params VERBATIM
      # expects snake_case, operator only camelCases its own typed fields
      max_parallel_requests: 1
  info:
    mode: chat
    maxTokens: 32768
    maxInputTokens: 98304 # contextSize 131072 minus maxOutputTokens; llama.cpp counts both against one pool
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: true
      input_cost_per_token: 0.0000000120
      cache_creation_input_token_cost: 0.0000000120
      cache_read_input_token_cost: 0.0000000010
      output_cost_per_token: 0.0000000500
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name qwen-local-fast
spec:
  # Same llama-qwen as qwen-local — model-picker change, not a restart.
  # Only difference: thinking off plus the model's instruct sampler row.
  modelName: *name
  params:
    model: openai/Qwen3.8-27B
    # Router, not the service: naming the model is what wakes it when comfyui
    # holds the slot. The backend's displayName keeps `model` unchanged.
    apiBase: http://ai3090-router-router-proxy.ai.svc.cluster.local:8080/v1
    apiKeyRef:
      name: litellm-secret
      key: LLAMA_API_KEY
    additional:
      # Keys under `additional` are copied into litellm_params VERBATIM
      # expects snake_case, operator only camelCases its own typed fields
      max_parallel_requests: 1
      extra_body:
        # extra_body bypasses the proxy's drop_params, so this reaches llama.cpp intact
        chat_template_kwargs:
          enable_thinking: false
        temperature: 0.7
        top_p: 0.80
        presence_penalty: 1.5
  info:
    mode: chat
    maxTokens: 32768
    maxInputTokens: 98304 # contextSize 131072 minus maxOutputTokens; llama.cpp counts both against one pool
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: false
      input_cost_per_token: 0.0000000120
      cache_creation_input_token_cost: 0.0000000120
      cache_read_input_token_cost: 0.0000000010
      output_cost_per_token: 0.0000000500
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name comfyui
spec:
  # Not a chat model — the wake switch for the GPU slot. Sending it anything
  # swaps ComfyUI in; the reply carries the UI's URL.
  modelName: *name
  params:
    model: openai/comfyui
    apiBase: http://ai3090-router-router-proxy.ai.svc.cluster.local:8080/v1
    apiKeyRef:
      name: litellm-secret
      key: LLAMA_API_KEY
    additional:
      max_parallel_requests: 1
      # Must outlast a cold start: if the client gives up first the activator
      # scales ComfyUI back to zero and the wake is lost.
      timeout: 1800
  info:
    mode: chat
    maxTokens: 512
    maxInputTokens: 512
    maxOutputTokens: 512
    extra:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name memini-embed
spec:
  modelName: *name
  params:
    model: openai/memini-embed
    apiBase: http://memini-embed.ai.svc.cluster.local:8080/v1
    apiKeyRef:
      name: litellm-secret
      key: MEMINI_EMBED_API_KEY
  info:
    mode: embedding
    extra:
      input_cost_per_token: 0.0000000120
      output_cost_per_token: 0.0000000500
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name memini-rerank
spec:
