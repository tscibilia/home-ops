---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbox-zero
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 200"]
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
  rules:
    - backendRefs:
        # <fullname>-web, where fullname is the release name because it
        # already contains the chart name.
        - name: inbox-zero-web
          port: 80
