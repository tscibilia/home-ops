---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name inbox-zero-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        DATABASE_URL: "postgresql://${APP}:{{ .${APP}_postgres_password }}@${CNPG_NAME:=pgcluster-default}-rw.database.svc.cluster.local:5432/${APP}?schema=public"
        DIRECT_URL: "postgresql://${APP}:{{ .${APP}_postgres_password }}@${CNPG_NAME:=pgcluster-default}-rw.database.svc.cluster.local:5432/${APP}?schema=public"
        # Shared Dragonfly: DB 4 is the only index not already taken
        REDIS_URL: "redis://dragonfly-cluster.database.svc.cluster.local:6379/4"
        REDIS_HTTP_URL: "http://inbox-zero-redis-http.ai.svc.cluster.local:80"
        REDIS_HTTP_TOKEN: "{{ .REDIS_HTTP_TOKEN }}"
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        EMAIL_ENCRYPT_SECRET: "{{ .EMAIL_ENCRYPT_SECRET }}"
        EMAIL_ENCRYPT_SALT: "{{ .EMAIL_ENCRYPT_SALT }}"
        INTERNAL_API_KEY: "{{ .INTERNAL_API_KEY }}"
        CRON_SECRET: "{{ .CRON_SECRET }}"
        # Litellm virtual key; the openai-compatible provider reads LLM_API_KEY.
        LLM_API_KEY: "{{ .LITELLM_INBOXZERO_AGENTKEY }}"
  dataFrom:
    - extract:
        key: /ai/inbox-zero
    - extract:
        key: /ai/litellm
    - extract:
        key: /database/cnpg-users
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  # Seeds the CNPG role password so it never has to be created by hand. The
  # generator is stateless, so refreshInterval "0" is what pins the value.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
