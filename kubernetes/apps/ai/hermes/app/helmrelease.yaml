---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-agent-source:
            image: &img
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            command:
              - /bin/sh
              - -c
              - |
                set -e
                cp -r /opt/hermes/. /agent-src/
                chown -R 10000:10000 /agent-src/
                chmod -R u+rwX /agent-src/plugins/
            securityContext:
              allowPrivilegeEscalation: true
              runAsGroup: 0
              runAsUser: 0
          02-init-config:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
                cp /run/config/config.yaml /opt/data/config.yaml
                sed -i "s|\$${LITELLM_API_KEY}|$$LITELLM_API_KEY|g" /opt/data/config.yaml
                sed -i "s|\$${SECRET_DOMAIN}|$$SECRET_DOMAIN|g" /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                # Overwrites any agent self-edit — SOUL.md is GitOps-owned.
                cp /run/config/SOUL.md /opt/data/SOUL.md
                chown 10000:10000 /opt/data/SOUL.md
                # SSH commit-signing key. ssh-keygen refuses a key that is group
                # or world readable, so 0600 is load-bearing, not hygiene.
                mkdir -p /opt/data/.ssh
                chmod 700 /opt/data/.ssh
                printf '%s\n' "$$GH_HERMES_SIGNING_KEY" > /opt/data/.ssh/hermes_signing
                chmod 600 /opt/data/.ssh/hermes_signing
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              runAsGroup: &uid 10000
              runAsUser: *uid
          03-install-tools:
            image: *img
            env:
              # ~/.config/gh is root-owned; this container is uid 10000 and could
              # not write there. Also avoids setting HOME, which would move where
              # brew and npm install below.
              GH_CONFIG_DIR: &ghConfigDir /opt/data/.gh
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - /bin/sh
              - -c
              - |
                set -e
                mkdir -p /opt/data/.local/bin /opt/data/.local/go

                rm -f /opt/data/.local/bin/hermes /opt/data/.local/bin/docker

                if [ ! -f /opt/data/.local/bin/gh ]; then
                  cd /tmp
                  curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                  tar xzf gh.tar.gz
                  cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                  rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                fi

                if [ ! -f /opt/data/.local/go/bin/go ]; then
                  cd /tmp
                  curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                  tar xzf go.tar.gz
                  mv go /opt/data/.local/
                  rm -rf go.tar.gz
                fi

                if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                  export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                  mkdir -p $HOMEBREW_PREFIX
                  git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                fi

                if [ -f /opt/hermes/plugins/platforms/photon/sidecar/package.json ]; then
                  cd /opt/hermes/plugins/platforms/photon/sidecar && npm ci 2>/dev/null || npm install
                fi

                # The agent's shell never sees GITHUB_TOKEN, so gh needs it on
                # disk. `env -u` is required — gh refuses --with-token while
                # GITHUB_TOKEN is set. Re-runs each boot to pick up rotation.
                if [ -n "$$GITHUB_TOKEN" ]; then
                  printf '%s' "$$GITHUB_TOKEN" \
                    | env -u GITHUB_TOKEN -u GH_TOKEN /opt/data/.local/bin/gh auth login --with-token
                fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              runAsGroup: &uid 10000
              runAsUser: *uid
        containers:
          app:
            image: *img
            args: ["gateway", "run"]
            env:
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &apiPort 8642
              HERMES_HOME: /opt/data
              HOME: /opt/data
              HOMEBREW_CELLAR: /opt/data/.local/homebrew/Cellar
              HOMEBREW_PREFIX: /opt/data/.local/homebrew
              HOMEBREW_REPOSITORY: /opt/data/.local/homebrew
              # platform-agnostic allow-all that short-circuits per-platform allowlist
              GATEWAY_ALLOW_ALL_USERS: false
              # Must match 03-install-tools, or gh looks in the root-owned default.
              GH_CONFIG_DIR: *ghConfigDir
              # No ~/.gitconfig on the PVC, so `git commit` has no identity and no signing
              # config. GIT_CONFIG_COUNT/KEY/VALUE supplies both without writing a file.
              GIT_AUTHOR_NAME: &gitUser hermes
              GIT_AUTHOR_EMAIL: &gitEmail 585808+tscibilia@users.noreply.github.com
              GIT_COMMITTER_NAME: *gitUser
              GIT_COMMITTER_EMAIL: *gitEmail
              # Push auth. GITHUB_TOKEN is scrubbed from every shell the terminal tool
              # spawns (_ALWAYS_STRIP_KEYS), so an env credential can never reach git.
              GIT_SSH_COMMAND: ssh -i /opt/data/.ssh/hermes_signing -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
              GIT_CONFIG_COUNT: "5"
              GIT_CONFIG_KEY_0: gpg.format
              GIT_CONFIG_VALUE_0: ssh
              GIT_CONFIG_KEY_1: user.signingkey
              GIT_CONFIG_VALUE_1: /opt/data/.ssh/hermes_signing
              GIT_CONFIG_KEY_2: commit.gpgsign
              GIT_CONFIG_VALUE_2: "true"
              GIT_CONFIG_KEY_3: tag.gpgsign
              GIT_CONFIG_VALUE_3: "true"
              # Rewrites the existing HTTPS clone and every future one onto SSH,
              # so no re-clone and no remote surgery is needed.
              GIT_CONFIG_KEY_4: url.git@github.com:.insteadOf
              GIT_CONFIG_VALUE_4: https://github.com/
              GOPATH: /opt/data/go
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              MEMINI_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: tscibilia/hermes
              SEARXNG_URL: http://searxng.default.svc.cluster.local:8080
              TERM: xterm-256color
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
            # The image entrypoint starts as root for s6/permission setup, then
            # drops gateway execution to the non-root hermes user.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
          dashboard:
            image: *img
            args: ["dashboard", "--host", "0.0.0.0"]
            env:
              GATEWAY_HEALTH_URL: http://localhost:8642
              HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email offline_access"
              HERMES_DASHBOARD_PUBLIC_URL: https://${APP}.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-secret"
            ports:
              - containerPort: &dashPort 9119
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /opt/data/.vscode
              - --extensions-dir
              - /opt/data/.vscode
              - --port
              - "12321"
              - /opt/data
            env:
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: GITHUB_TOKEN
              # DISCORD_WEBHOOK:
              #   valueFrom:
              #     secretKeyRef:
              #       name: hermes-secret
              #       key: DISCORD_WEBHOOK
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        serviceAccount:
          identifier: *app
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: *uid
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          api:
            port: *apiPort
          dashboard:
            port: *dashPort
          codeserver:
            port: 12321
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      codeserver:
        hostnames: ["{{ .Release.Name }}-code.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: codeserver
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          *app :
            02-init-config:
              - path: /opt/data
            03-install-tools:
              - path: /opt/data
            app:
              - path: /opt/data
            dashboard:
              - path: /opt/data
            codeserver:
              - path: /opt/data
      config:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        defaultMode: 0o755
        globalMounts:
          - path: /run/config/config.yaml
            subPath: config.yaml
      soul:
        type: configMap
        name: hermes-soul
        globalMounts:
          - path: /run/config/SOUL.md
            subPath: SOUL.md
      nfs:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/shares/hermes
        globalMounts:
          - path: /nfs-data
      agent-source:
        type: emptyDir
        advancedMounts:
          *app :
            01-agent-source:
              - path: /agent-src
            03-install-tools:
              - path: /opt/hermes
            app:
              - path: /opt/hermes
            dashboard:
              - path: /opt/hermes
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /cache
            subPath: cache
    rbac:
      roles:
        hermes-read-all:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
                - pods/log
                - nodes
                - services
                - namespaces
                - configmaps
                - persistentvolumes
                - persistentvolumeclaims
                - endpoints
                - resourcequotas
                - limitranges
                - serviceaccounts
                - events
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "apps"
              resources:
                - deployments
                - daemonsets
                - statefulsets
                - replicasets
                - controllerrevisions
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "batch"
              resources:
                - "jobs"
                - "cronjobs"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "networking.k8s.io"
              resources:
                - "ingresses"
                - "ingressclasses"
                - "networkpolicies"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "storage.k8s.io"
              resources:
                - storageclasses
                - csinodes
                - csidrivers
                - volumeattachments
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "helm.toolkit.fluxcd.io"
              resources:
                - "helmreleases"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "kustomize.toolkit.fluxcd.io"
              resources:
                - "kustomizations"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "source.toolkit.fluxcd.io"
              resources:
                - gitrepositories
                - helmrepositories
                - ocirepositories
                - buckets
                - helmcharts
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "external-secrets.io"
              resources:
                - externalsecrets
                - secretstores
                - clustersecretstores
              verbs:
                - "get"
                - "list"
                - "watch"
        hermes-pod-delete:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - "pods"
              verbs:
                - "delete"
        hermes-exec-deploy:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - "pods/exec"
              verbs:
                - "create"
            - apiGroups:
                - "apps"
              resources:
                - "deployments"
              verbs:
                - "patch"
                - "update"
      bindings:
        hermes-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-read-all
          subjects:
            - identifier: *app
              serviceAccount: *app
        hermes-pod-delete:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-pod-delete
          subjects:
            - identifier: *app
              serviceAccount: *app
        hermes-exec-deploy:
          type: RoleBinding
          roleRef:
            identifier: hermes-exec-deploy
          subjects:
            - identifier: *app
              serviceAccount: *app
              namespace: "{{ .Release.Namespace }}"
