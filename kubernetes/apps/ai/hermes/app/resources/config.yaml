# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-configmap
data:
  config.yaml: |-
    providers:
      litellm:
        api: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: "$${LITELLM_API_KEY}"
        models:
          qwen-local:
            context_length: 131072
          qwen-local-fast:
            context_length: 131072
          kimi-k3:
            context_length: 1048560
          laguna-s-2-1:
            context_length: 1048576
          deepseek-v4-flash-free:
            context_length: 200000
          minimax-m3:
            context_length: 512000
          glm-5-2:
            context_length: 1048560
    model:
      default: deepseek-v4-flash-free
      provider: litellm
    fallback_providers:
      - provider: litellm
        model: qwen-local
      - provider: litellm
        model: minimax-m3
      - provider: litellm
        model: glm-5-2
    # Side tasks. Default "auto" would reuse the main chat model for all of
    # them; pinning keeps the cheap/local models on the cheap work.
    auxiliary:
      vision:
        provider: custom:litellm
        model: qwen-local-fast # supportsVision, on-node, no per-token cost
        timeout: 60
      web_extract:
        provider: custom:litellm
        model: qwen-local-fast
        reasoning_effort: none
      title_generation:
        enabled: true
        provider: custom:litellm
        model: qwen-local-fast
        max_concurrency: 2
      session_search:
        provider: custom:litellm
        model: qwen-local-fast
        max_concurrency: 2
      compression:
        provider: custom:litellm
        model: laguna-s-2-1 # 1M input window — the aux task that reads the most
        max_concurrency: 2
      moa_reference:
        provider: custom:litellm
        timeout: 900
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
      tool_use_enforcement: auto
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    # No model/provider override: children inherit the parent model.
    delegation:
      max_iterations: 50
      max_concurrent_children: 3
      max_spawn_depth: 1
      subagent_auto_approve: false # deny, never block on stdin the gateway does not own
    # Opt-in only — runs on /moa, never on a normal turn. References answer in
    # private, the aggregator merges them into guidance for the main model.
    moa:
      default_preset: council
      presets:
        council:
          enabled: true
          reference_models:
            - provider: custom:litellm
              model: qwen-local
            - provider: custom:litellm
              model: minimax-m3
          aggregator:
            provider: custom:litellm
            model: kimi-k3
          max_tokens: 4096
    approvals:
      mode: smart
      timeout: 60
      cron_mode: deny
      mcp_reload_confirm: true
      destructive_slash_confirm: true
      # fnmatch globs, matched before the yolo bypass. Belt; the braces are
      # GitHub branch protection plus the fine-grained PAT scope.
      deny:
        - "git push*origin main*"
        - "git push*origin master*"
        - "git push*:main*"
        - "git push*--force*"
        - "git push*-f *"
        - "gh pr merge*"
        - "gh repo delete*"
    command_allowlist:
      - execute_code
      - "curl *$${SECRET_DOMAIN}*"
      - "curl *.ai.svc.cluster.local*"
      - "wget *$${SECRET_DOMAIN}*"
    discord:
      require_mention: true
      thread_require_mention: false
      auto_thread: true
      reactions: true
      ignored_channels: []
      no_thread_channels: []
      history_backfill: false
      history_backfill_limit: 50
      # Per-room operating rules, appended below SOUL.md rather than replacing it.
      # SOUL.md is the stable (cached) prompt tier and holds personality only;
      # the job of the room belongs here, in the context tier.
      channel_prompts:
        "1538717403326849044": |- # hermes-k8s
          This room is cluster work: Tom's homelab — Talos, Kubernetes, Flux CD
          and Rook Ceph across three bare-metal nodes. Git is truth. Anything
          you change by hand, Flux will undo, and it will be right to.

          The repo is tscibilia/home-ops. Clone or refresh it under
          /opt/data/workspace and work from inside the clone.

          Before cluster work, read AGENTS.md and CONTEXT.md from that clone.
          They are the authority on conventions, safety tiers, the docs/context
          routing table and the ADR index — do not restate them from memory,
          and do not assume they were auto-loaded. Read them, then follow them.

          Lead with the command you ran and what it returned. Tom reads YAML
          fluently and does not need it explained.
        "1538680877096247296": |- # hermes-aid — also the cron/unprompted home channel
          This room is not cluster work. You are Tom's personal assistant
          here: research, drafting, planning, summarising, remembering, and
          keeping track of what he asked for last week.

          There is no repo to read and no cluster to protect, so none of the
          homelab process applies. Warmer than the ops room, still short.

          Ask one clarifying question when the ask is vague; guess when it is
          cheap to be wrong. Use memory freely — this is the room where
          remembering him is the whole job.
      allow_mentions:
        everyone: false
        roles: false
        users: true
        replied_user: true
    gateway:
      platforms:
        photon:
          enabled: true
          require_mention: true
        discord:
          enabled: true
          gateway_restart_notification: false
    group_sessions_per_user: false
    memory:
      auto_migrate: true
      auto_summarize:
        threshold: 50
      provider: memini
    plugins:
      enabled:
        - memini
    mcp_servers:
      homelab:
        url: http://litellm.ai.svc.cluster.local:4000/mcp
        headers:
          Authorization: "Bearer $${LITELLM_API_KEY}"
    # Photon has no per-conversation prompt like discord.channel_prompts; this
    # is the platform-wide equivalent. `append` keeps the built-in hint.
    platform_hints:
      photon:
        append: |-
          This is iMessage, and it is personal — not cluster work. Research,
          drafting, planning, reminders, and keeping track of what he asked
          for last week.

          Assume a phone. Short messages. No code blocks, no YAML, no tables.
          If the answer needs more than a few lines, say so and offer to move
          it to Discord rather than sending a wall of text.

          Use memory freely — remembering him is most of the job here.
    platform_toolsets:
      cli:
        - hermes-cli
      photon:
        - hermes-cli
    privacy:
      redact_pii: true
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true
    streaming:
      enabled: false
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
    toolsets:
      - hermes-cli
    web:
      search_backend: searxng
  env: |-
    LITELLM_API_KEY={{ .LITELLM_HERMES_AGENTKEY }}
    SECRET_DOMAIN={{ .SECRET_DOMAIN }}
