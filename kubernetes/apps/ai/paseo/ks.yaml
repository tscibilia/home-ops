---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paseo
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: secret-stores
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: litellm-operator
      namespace: ai
    - name: litellm
      namespace: ai
  interval: 1h
  retryInterval: 5m
  path: ./kubernetes/apps/ai/paseo/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 15Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
