# Generic agent policy for every repo on this host.
# The secret-guard hook (hooks/pre/secret-guard.ts) owns secret value reads:
# it hard-denies them and allows the metadata projections in
# docs/context/secrets.md. These patterns are a cheap second layer for
# commands that are never safe, so they do not need path parsing.
# Repo-specific rules belong in <repo>/.omp/config.yml.
bash:
  patterns:
    - match: "pg_dump*"
      approval: deny
    - match: "pg_restore*"
      approval: deny
    - match: "sops -d*"
      approval: deny
    - match: "sops exec-env*"
      approval: deny
    - match: "printenv*"
      approval: deny
    - match: "ps eww*"
      approval: deny
    - match: "cat *.sqlite*"
      approval: deny
    - match: "env"
      approval: deny
    - match: "helm get values*"
      approval: deny
    - match: "helm get manifest*"
      approval: deny
    - match: "kubectl cp*"
      approval: deny
    - match: "kubectl exec*-- env*"
      approval: deny
    - match: "kubectl exec*-- printenv*"
      approval: deny
    - match: "kubectl exec*-- export*"
      approval: deny
    - match: "kubectl exec*-- cat*"
      approval: deny
    - match: "kubectl exec*-- sh*"
      approval: deny
    - match: "kubectl exec*-- bash*"
      approval: deny
    - match: "kubectl exec*-- python*"
      approval: deny
# Foreign user-level config sources only. Native OMP discovery is always on
enabledProviders:
  - opencode
# Keep OMP on litellm; OPENCODE_API_KEY in the pod env would otherwise surface these
disabledProviders:
  - opencode-zen
  - opencode-go
symbolPreset: unicode
modelRoles:
  task: litellm/deepseek-v4-flash
  smol: litellm/qwen-local
  advisor: litellm/deepseek-v4.1-flash:high
  vision: litellm/qwen-local
  plan: litellm/deepseek-v4.1-flash:high
  commit: litellm/qwen-local-fast
  default: litellm/deepseek-v4.1-flash:medium
  web: web/searxng
retry:
  fallbackChains:
    litellm/qwen-local:
      - litellm/deepseek-v4-flash
cycleOrder:
  - smol
  - slow
hideThinkingBlock: true
update:
  auto: false
