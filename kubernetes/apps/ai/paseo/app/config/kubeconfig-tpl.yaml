---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paseo-kubeconfig-tpl
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - cluster:
          server: https://k8s.internal:6443
          certificate-authority-data: {{ .CLUSTER_CA_CRT }}
        name: main
    contexts:
      - context:
          cluster: main
          user: admin@main
        name: main
    current-context: main
    users:
      - name: admin@main
        user:
          client-certificate-data: {{ .CLIENT_CERTIFICATE_DATA }}
          client-key-data: {{ .CLIENT_KEY_DATA }}
