---
# Static kubeconfig for the pod's own ServiceAccount. The token and CA are the
# projected service-account files, so kubelet rotation applies and no long-lived
# credential is copied into the image or the PVC.
apiVersion: v1
kind: Config
clusters:
  - cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    name: in-cluster
contexts:
  - context:
      cluster: in-cluster
      user: paseo
    name: in-cluster
current-context: in-cluster
users:
  - name: paseo
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
