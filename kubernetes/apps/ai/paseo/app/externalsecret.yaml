---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: /ai/paseo
        property: PASEO_PASSWORD
    - secretKey: PASEO_SIGNING_KEY
      remoteRef:
        key: /ai/paseo
        property: PASEO_SIGNING_KEY
    - secretKey: GH_TOKEN
      remoteRef:
        key: /ai/paseo
        property: GH_PASEO_TOKEN
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: /ai/memini
        property: MEMINI_PASEO_API_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: paseo-ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .GHCR_USER }}","password":"{{ .GHCR_TOKEN }}","auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: /kubernetes/github
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-kubeconfig
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: paseo-kubeconfig
    template:
      engineVersion: v2
      mergePolicy: Replace
      templateFrom:
        - configMap:
            name: paseo-kubeconfig-tpl
            items:
              - key: kubeconfig
                templateAs: Values
          target: Data
  dataFrom:
    - extract:
        key: /kubernetes/kubeconfig
    - extract:
        key: /talos-m70q
