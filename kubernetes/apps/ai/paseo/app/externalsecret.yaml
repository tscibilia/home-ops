---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        PASEO_PASSWORD: "{{ .PASEO_PASSWORD }}"
        PASEO_SIGNING_KEY: "{{ .PASEO_SIGNING_KEY }}"
        GH_TOKEN: "{{ .GH_PASEO_TOKEN }}"
        AKEYLESS_ACCESS_ID: "{{ .AKEYLESS_ACCESS_ID }}"
        AKEYLESS_ACCESS_KEY: "{{ .AKEYLESS_ACCESS_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_PASEO_API_KEY }}"
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY_v1 }}"
  data:
    - secretKey: AKEYLESS_ACCESS_ID
      remoteRef:
        key: docker/doco-cd/akeyless-access-id
    - secretKey: AKEYLESS_ACCESS_KEY
      remoteRef:
        key: docker/doco-cd/akeyless-access-key
  dataFrom:
    - extract:
        key: /cloud-providers/ai-apis
    - extract:
        key: /ai/paseo
    - extract:
        key: /ai/memini
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: paseo-ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .GHCR_USER }}","password":"{{ .GHCR_TOKEN }}","auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: /kubernetes/github
