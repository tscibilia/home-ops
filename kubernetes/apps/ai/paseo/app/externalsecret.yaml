---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: /ai/paseo
        property: PASEO_PASSWORD
    - secretKey: PASEO_SIGNING_KEY
      remoteRef:
        key: /ai/paseo
        property: PASEO_SIGNING_KEY
    - secretKey: GH_TOKEN
      remoteRef:
        key: /ai/paseo
        property: GH_PASEO_TOKEN
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: /ai/memini
        property: MEMINI_PASEO_API_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: paseo-ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .GHCR_USER }}","password":"{{ .GHCR_TOKEN }}","auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: /kubernetes/github
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-kubeconfig
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: paseo-kubeconfig
    template:
      data:
        kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: https://k8s.internal:6443
                certificate-authority-data: {{ .CLUSTER_CA_CRT }}
              name: main
          contexts:
            - context:
                cluster: main
                user: admin@main
              name: main
          current-context: main
          users:
            - name: admin@main
              user:
                client-certificate-data: {{ .CLIENT_CERTIFICATE_DATA }}
                client-key-data: {{ .CLIENT_KEY_DATA }}
  dataFrom:
    - extract:
        key: /kubernetes/kubeconfig
