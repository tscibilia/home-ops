---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: paseo
spec:
  proxyRef: litellm
  keyAlias: paseo
  secretName: litellm-key-paseo
  secretKey: api-key
  models:
    - all-proxy-models
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-paseo
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: akeyless-secret-store
  selector:
    secret:
      name: litellm-key-paseo
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: /ai/litellm
          property: LITELLM_PASEO_AGENTKEY
