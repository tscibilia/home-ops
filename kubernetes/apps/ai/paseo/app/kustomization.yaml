---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./litellmkey.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
  - ./rbac.yaml
  - ./talos-serviceaccount.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: paseo-configmap
    files:
      - paseo.json=./config/paseo.json
      - opencode.json=./config/opencode.json
      - prune-branches.sh=./config/prune-branches.sh
      - gitconfig=./config/gitconfig
      - omp-config.yml=./config/omp-config.yml
      - omp-models.yml=./config/omp-models.yml
      - kubeconfig=./config/kubeconfig.yaml
