---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/component_v1alpha1.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./resources/memini-embed.yaml
  - ./resources/memini-rerank.yaml
  - ./pushsecret.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: memini-initdb
    files:
      - ./resources/memini.sql
