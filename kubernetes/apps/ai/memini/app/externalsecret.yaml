---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        MEMINI_API_KEY: "{{ .MEMINI_ADMIN_API_KEY }}"
        MEMINI_EMBED_API_KEY: "{{ .LITELLM_MEMINI_API_KEY }}"
        MEMINI_RERANK_API_KEY: "{{ .LITELLM_MEMINI_API_KEY }}"
  dataFrom:
    - extract:
        key: /ai/memini
    - extract:
        key: /ai/litellm
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        api-keys.yaml: | # https://git.erwanleboucher.dev/eleboucher/memini/src/branch/main/docs/guides/homelab-team.md
          keys:
          - name: hermes
            secret: {{ .MEMINI_HERMES_API_KEY }}
            home: tscibilia/personal
            default_namespace: tscibilia/hermes
            admin: false
          - name: opencode
            secret: {{ .MEMINI_OPENCODE_API_KEY }}
            home: tscibilia/personal
            default_namespace: tscibilia/opencode
            admin: false
  dataFrom:
    - extract:
        key: /ai/memini
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  # Seeds the CNPG role password so it never has to be created by hand. The
  # generator is stateless, so refreshInterval "0" is what pins the value.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
