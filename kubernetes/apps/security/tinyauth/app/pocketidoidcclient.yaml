---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: tinyauth
spec:
  name: Tinyauth
  callbackUrls:
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/api/oauth/callback/pocketid"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  pkceEnabled: true
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
  secret:
    enabled: true
    name: tinyauth-oidc-secret
    keys:
      clientID: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID
      clientSecret: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET
