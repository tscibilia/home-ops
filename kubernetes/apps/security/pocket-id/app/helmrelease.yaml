---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    instance:
      enabled: false
    operator:
      # homarr dashboard-icons only publishes -light variants for ~1/6 of icons; a 404
      # dark logo makes Pocket-ID reject the whole client update (422 logo_download_failed)
      defaultDarkLogoUrl: ""
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
