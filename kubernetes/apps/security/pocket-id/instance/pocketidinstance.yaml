---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidinstance_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: &app pocketid
spec:
  podTemplate:
    spec:
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18
          envFrom:
            - secretRef:
                name: "${APP}-initdb-secret"
  image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless@sha256:e0f83a42a78d0759b6d2d8c7380ef0fa8a4c95dfa01ad88740a073ae9cc4ba94
  deploymentType: Deployment
  timezone: "${TIMEZONE}"
  appUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
  databaseUrl:
    valueFrom:
      secretKeyRef:
        name: "${APP}-pguser-secret"
        key: uri
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: &secret pocket-id-secret
        key: ENCRYPTION_KEY
  smtp:
    host: "smtp-relay.default.svc.cluster.local"
    port: 2525
    from: "pocket-id@mail.${SECRET_DOMAIN}"
  geoip:
    dbPath: "/app/data/GeoLite2-City.mmdb"
    maxmindLicenseKey:
      valueFrom:
        secretKeyRef:
          name: *secret
          key: MAXMIND_LICENSE_KEY
  ui:
    appName: "Pocket ID"
    sessionDuration: 43200
  userManagement:
    emailsVerified: false # auto-verify emails
    allowOwnAccountEdit: true # let users edit own details
    allowUserSignups: "disabled"
  emailNotifications:
    loginNotification: false # notify on login from new device
    oneTimeAccessAsAdmin: true # admins can send login codes
    apiKeyExpiration: true # notify when API keys are about to expire
    verification: true # email verification on signup/change
  logging:
    level: "info"
  metrics:
    enabled: true
  analyticsDisabled: true
  versionCheckDisabled: true
  trustedProxies:
    enabled: true
    cidrs: ["10.42.0.0/16"]
  route:
    enabled: true
    hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
    parentRefs:
      - name: envoy-external
        namespace: network
  persistence:
    enabled: true
    existingClaim: *app
    path: /app/data
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi
