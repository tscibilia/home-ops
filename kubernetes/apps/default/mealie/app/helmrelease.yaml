---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69
            env:
              DB_ENGINE: "postgres"
              POSTGRES_DB: *app
              POSTGRES_USER: *app
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-pguser-secret"
                    key: password
              POSTGRES_SERVER:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-pguser-secret"
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-pguser-secret"
                    key: port
              # Base Values
              ALLOW_SIGNUP: "false"
              ALLOW_PASSWORD_LOGIN: "false"
              API_DOCS: "false"
              BASE_URL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              MAX_WORKERS: "1"
              WORKERS_PER_CORE: "1"
              WEB_CONCURRENCY: "1"
              # OIDC Values
              OIDC_AUTH_ENABLED: "true"
              OIDC_SIGNUP_ENABLED: "true"
              OIDC_USER_GROUP: ID-Family
              OIDC_ADMIN_GROUP: ID-Admin
              OIDC_SCOPES_OVERRIDE: "openid profile email groups"
              OIDC_AUTO_REDIRECT: "false" # true, you will be sent directly to your Identity Provider
              OIDC_PROVIDER_NAME: PocketID
              OIDC_REMEMBER_ME: "true"
              OIDC_USER_CLAIM: email
              # OpenAI Values
              OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              OPENAI_MODEL: "qwen-local"
              OPENAI_ENABLE_IMAGE_SERVICES: "true" #creating recipes via image
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-secret"
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 512Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: ${GATUS_PATH}
                    port: &port 9000
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                enabled: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/data/
