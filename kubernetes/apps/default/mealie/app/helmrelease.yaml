---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.28.0@sha256:8b02290f4d1806f02acac6f25f6d48a3c965612fda1f8e914d5af533276f8688
            env:
              DB_ENGINE: "postgres"
              POSTGRES_DB: *app
              POSTGRES_USER: *app
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-pguser-secret"
                    key: password
              POSTGRES_SERVER:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-pguser-secret"
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-pguser-secret"
                    key: port
              # Base Values
              ALLOW_SIGNUP: "false"
              ALLOW_PASSWORD_LOGIN: "false"
              API_DOCS: "false"
              BASE_URL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              MAX_WORKERS: "1"
              WORKERS_PER_CORE: "1"
              WEB_CONCURRENCY: "1"
              # OIDC Values
              OIDC_AUTH_ENABLED: "true"
              OIDC_SIGNUP_ENABLED: "true"
              OIDC_USER_GROUP: ID-Family
              OIDC_ADMIN_GROUP: ID-Home
              OIDC_SCOPES_OVERRIDE: "openid profile email groups"
              OIDC_AUTO_REDIRECT: "false" # true, you will be sent directly to your Identity Provider
              OIDC_PROVIDER_NAME: PocketID
              OIDC_REMEMBER_ME: "true"
              OIDC_USER_CLAIM: email
              # OpenAI Values
              OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              OPENAI_MODEL: "qwen-local"
              OPENAI_ENABLE_IMAGE_SERVICES: "true" #creating recipes via image
              # Network Values
              HTTP_ALLOW_LIST: "10.42.0.0/16,10.43.0.0/16" # in-cluster pod+service subnets (litellm), SSRF-blocked by default in v3.26.0
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-secret"
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 512Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: ${GATUS_PATH}
                    port: &port 9000
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                enabled: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/data/
