---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: &name mealie-oidc-secret
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: akeyless-secret-store
  selector:
    secret:
      name: *name
  data:
    - match:
        secretKey: OIDC_CLIENT_ID
        remoteRef:
          remoteKey: /security/pocket-id-clients
          property: MEALIE_OIDC_CLIENT_ID
    - match:
        secretKey: OIDC_CLIENT_SECRET
        remoteRef:
          remoteKey: /security/pocket-id-clients
          property: MEALIE_OIDC_CLIENT_SECRET
