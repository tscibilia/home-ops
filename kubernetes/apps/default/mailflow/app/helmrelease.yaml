---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mailflow
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      api:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        initContainers:
          # Sizing the DB after backfill (psql against CNPG cluster pgcluster-default, ns database):
          #   SELECT pg_size_pretty(pg_total_relation_size('messages'));  -- table + all its indexes
          #   SELECT count(*), pg_size_pretty(sum(length(coalesce(body_text,'')))) FROM messages;  -- body footprint
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
            securityContext: &initSec
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: true
        containers:
          app:
            image:
              repository: ghcr.io/maathimself/mailflow-backend
              tag: 4.1.0@sha256:28c92c8c2ed1c71daa181d6a3275ec30458fcb2172fb0047fe9f2394886c43eb
            env:
              NODE_ENV: production
              PORT: &apiPort 3000
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-secret"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: ${GATUS_PATH}
                    port: *apiPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/maathimself/mailflow-frontend
              tag: 4.1.0@sha256:a24df93a7b2ba778dae12c4fb3e41419ea8cbbd597a44c12caff0eeae20c42e5
            env:
              APP_HTTP_PORT: &webPort 80
              BACKEND_HOST: mailflow-api.default.svc.cluster.local
              BACKEND_PORT: 3000
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: /
                    port: *webPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: *initSec
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      web:
        controller: web
        ports:
          http:
            port: *webPort
      api:
        controller: api
        ports:
          http:
            port: *apiPort
    route:
      web:
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: web
                port: *webPort
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      nginx-cache:
        type: emptyDir
        advancedMounts:
          web:
            app:
              - path: /var/cache/nginx
              - path: /var/run
