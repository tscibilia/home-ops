---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: komga
spec:
  name: Komga
  callbackUrls:
    # Spring derives the callback path from the registration id, which is
    # "pocketid" here (see helmrelease.yaml) — hence /login/oauth2/code/pocketid.
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/login/oauth2/code/pocketid"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  pkceEnabled: false
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
    - name: id-friends
      namespace: security
  secret:
    enabled: true
    name: komga-oidc-secret
    keys:
      clientID: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_POCKETID_CLIENT_ID
      clientSecret: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_POCKETID_CLIENT_SECRET
      issuerUrl: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_POCKETID_ISSUER_URI
