---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homebox-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        HBOX_AUTH_API_KEY_PEPPER: "{{ .HBOX_AUTH_API_KEY_PEPPER }}"
        HBOX_MAILER_HOST: "{{ .SMTP_HOST }}"
        HBOX_MAILER_PORT: "{{ .SMTP_PORT }}"
        HBOX_MAILER_USERNAME: "{{ .SMTP_USERNAME }}"
        HBOX_MAILER_PASSWORD: "{{ .SMTP_PASSWORD }}"
        HBOX_MAILER_FROM: "{{ .SMTP_FROM }}"
        HBOX_DATABASE_HOST: "${CNPG_NAME:=pgcluster-default}-rw.database.svc.cluster.local"
        HBOX_DATABASE_PORT: "5432"
        HBOX_DATABASE_DATABASE: "${APP}"
        HBOX_DATABASE_USERNAME: "${APP}"
        HBOX_DATABASE_PASSWORD: "{{ .${APP}_postgres_password }}"
  dataFrom:
    - extract:
        key: /cloud-providers/ses-creds
    - extract:
        key: /default/homebox
    - extract:
        key: /database/cnpg-users
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  # Seeds the CNPG role password so it never has to be created by hand. The
  # generator is stateless, so refreshInterval "0" is what pins the value.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
