---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cetranscript-ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .GHCR_USER }}","password":"{{ .GHCR_TOKEN }}","auth":"{{ printf "%s:%s" .GHCR_USER .GHCR_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: /kubernetes/github
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cetranscript-api-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        DATABASE_URL: "postgresql://${APP}:{{ .cetranscript_postgres_password }}@${CNPG_NAME:=pgcluster-default}-rw.database.svc.cluster.local:5432/${APP}"
        VALKEY_URL: "redis://dragonfly-cluster.database.svc.cluster.local:6379/7"
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        PROVIDER_SECRET_KEY: "{{ .PROVIDER_SECRET_KEY }}"
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        INITIAL_ADMIN_EMAIL: "{{ .INITIAL_ADMIN_EMAIL }}"
        STRIPE_SECRET_KEY: "{{ .STRIPE_SECRET_KEY }}"
        STRIPE_WEBHOOK_SECRET: "{{ .STRIPE_WEBHOOK_SECRET }}"
        STRIPE_PROBO_PRICE_ID: "{{ .STRIPE_PROBO_LIMITED_PRICE_ID }}"
        STRIPE_OMNIA_PRICE_ID: "{{ .STRIPE_OMNIA_LIMITED_PRICE_ID }}"
        RESEND_API_KEY: "{{ .RESEND_API_KEY }}"
        RESEND_WEBHOOK_SECRET: "{{ .RESEND_WEBHOOK_SECRET }}"
        FROM_EMAIL: "{{ .FROM_EMAIL }}"
        FORWARD_TO_EMAIL: "{{ .FORWARD_TO_EMAIL }}"
        VITE_SUPPORT_EMAIL: "{{ .VITE_SUPPORT_EMAIL }}"
        AIA_API_BASE_URL: https://ceproviderapi.aia.org
        NCARB_API_URL: https://www.ncarb.org/api/map/requirements
        USGBC_SEARCH_URL: https://pr-msearch.usgbc.org/elasticsearch_index_live_usgbc_usgbc_courses_dev/_msearch
        VAPID_PUBLIC_KEY: "{{ .VAPID_PUBLIC_KEY }}"
        VAPID_PRIVATE_KEY: "{{ .VAPID_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: /default/cetranscript
    - extract:
        key: /database/cnpg-users
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  # Seeds the CNPG role password so it never has to be created by hand. The
  # generator is stateless, so refreshInterval "0" is what pins the value.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
