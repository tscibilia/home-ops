---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name filebrowser-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        # FBQ has no per-key env override — clientSecret can only be set inside config.yaml.
        # The whole file templated here so the OIDC credentials never land in a git commit.
        config.yaml: |
          server:
            database:
              path: /data/filebrowser.db
            # Default is a RELATIVE "tmp" created next to the binary, which
            # readOnlyRootFilesystem blocks -> [FATAL] mkdir tmp: read-only file system.
            # Must be an absolute path on the writable emptyDir.
            cacheDir: /tmp/filebrowser
            sources:
              # defaultEnabled: false is what makes a source INVISIBLE to a user until an
              # admin puts it in their scopes. denyByDefault would leave it listed but
              # blocked — not the same thing.
              - path: /srv/users
                name: users
                config:
                  defaultEnabled: false
                  # false on purpose: with createUserDir on, a login whose NFS export is not
                  # mounted would mkdir into the pod's own filesystem, producing a directory
                  # that looks real in the UI but is not NFS-backed.
                  createUserDir: false
              - path: /srv/docs
                name: docs
                config:
                  defaultEnabled: false
              - path: /srv/system
                name: system
                config:
                  defaultEnabled: false
              - path: /srv/strata
                name: strata
                config:
                  defaultEnabled: false
              - path: /srv/grey
                name: grey
                config:
                  defaultEnabled: false

          http:
            port: ${FILEBROWSER_PORT}
            # REQUIRED behind Envoy. FileBrowser derives the OIDC callback from the incoming
            # request, not from externalUrl. Without this the callback registers as http://
            # with an internal host and PocketID rejects the login.
            trustProxyHeaders: true

          auth:
            methods:
              password:
                enabled: false
              oidc:
                enabled: true
                clientId: "{{ .FILEBROWSER_OIDC_CLIENT_ID }}"
                clientSecret: "{{ .FILEBROWSER_OIDC_CLIENT_SECRET }}"
                # Tracks pocket-id's own GATUS_SUBDOMAIN (kubernetes/apps/security/pocket-id/ks.yaml)
                issuerUrl: "https://id.${SECRET_DOMAIN}"
                scopes: "openid email profile groups"
                userIdentifier: preferred_username
                groupsClaim: groups
                adminGroup: "ID-Admin"
                userGroups: ["ID-Users"]
  dataFrom:
    - extract:
        key: /security/pocket-id-clients
