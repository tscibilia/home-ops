---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name filebrowser-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        # FBQ has no per-key env override — clientSecret can only be set inside config.yaml.
        # The whole file templated here so the OIDC credentials never land in a git commit.
        config.yaml: |
          server:
            database:
              path: /data/filebrowser.db
            # Default is a RELATIVE "tmp" created next to the binary, which
            # readOnlyRootFilesystem blocks -> [FATAL] mkdir tmp: read-only file system.
            # Must be an absolute path on the writable emptyDir.
            cacheDir: /tmp/filebrowser
            sources:
              # defaultEnabled: false hides a source until an admin scopes a user to it.
              # (denyByDefault would leave it listed but blocked — not the same.)
              # defaultPermissions seeds new scopes; tighten per scope in the UI.
              # `users` self-assigns: createUserDir scopes each login to <source>/<username>,
              # matching the mounts via OIDC preferred_username. A login with no mount
              # (sysadmin) gets a phantom dir in the container FS — gone on restart.
              - path: /srv/users
                name: users
                config:
                  defaultEnabled: true
                  createUserDir: true
                  defaultPermissions: &perms
                    view: true
                    download: true
                    modify: true
                    create: true
                    delete: true
              - path: /srv/docs
                name: docs
                config:
                  defaultEnabled: false
                  defaultPermissions: *perms
              - path: /srv/system
                name: system
                config:
                  defaultEnabled: false
                  defaultPermissions: *perms
              - path: /srv/strata
                name: strata
                config:
                  defaultEnabled: false
                  defaultPermissions: *perms
              - path: /srv/grey
                name: grey
                config:
                  defaultEnabled: false
                  defaultPermissions: *perms

          http:
            port: ${FILEBROWSER_PORT}
            # REQUIRED behind Envoy. FileBrowser derives the OIDC callback from the incoming
            # request, not from externalUrl. Without this the callback registers as http://
            # with an internal host and PocketID rejects the login.
            trustProxyHeaders: true

          # Seeds NEW users only. Keys verified against backend/pkg/settings/structs.go at
          # the running tag — preview-5 rejects unknown keys with a startup FATAL, has no
          # flat/deprecated fields, and does not match the published docs or main.
          # These are GLOBAL perms only; admin comes from adminGroup below.
          userDefaults:
            account:
              loginMethod: oidc
              permissions:
                admin: false
                api: false
                share: false
                realtime: false

          auth:
            methods:
              password:
                enabled: false
              oidc:
                enabled: true
                clientId: "{{ .FILEBROWSER_OIDC_CLIENT_ID }}"
                clientSecret: "{{ .FILEBROWSER_OIDC_CLIENT_SECRET }}"
                # Tracks pocket-id's own GATUS_SUBDOMAIN (kubernetes/apps/security/pocket-id/ks.yaml)
                issuerUrl: "https://id.${SECRET_DOMAIN}"
                scopes: "openid email profile groups"
                userIdentifier: preferred_username
                groupsClaim: groups
                adminGroup: "ID-Admin"
                userGroups: ["ID-Users"]
  dataFrom:
    - extract:
        key: /security/pocket-id-clients
