---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: filebrowser
spec:
  name: FileBrowser
  callbackUrls:
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/api/auth/oidc/callback"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  # FBQ v2.0.0-preview has no PKCE support — backend/http/oidc.go calls
  # oauth2Config.Exchange() with no AuthCodeOption, so no code_challenge is sent
  pkceEnabled: false
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-users
      namespace: security
  secret:
    enabled: true
    name: filebrowser-oidc-secret
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      discoveryUrl: OIDC_CONFIGURATION_URL
