---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app filebrowser
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # TODO: v2 is in beta. Renovate is pinned to 2.x.x-beta via a regex rule in
              # .renovate/overrides.json5 — stable/latest still resolve to v1, so matching
              # them would downgrade. Drop both when v2.0.0 GA ships.
              repository: ghcr.io/gtsteffaniak/filebrowser
              tag: 2.0.4-beta@sha256:80b7248660e5368fcc914d3eb5f538e2a3856ff833a2008ed04e36d9ce4e9e0f
            env:
              FILEBROWSER_CONFIG: /config/config.yaml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: ${GATUS_PATH}
                    port: &port ${FILEBROWSER_PORT}
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid 568
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [4006, 4007, 4008, 4009] # truenas GIDs; 4009=filebrowser_rw
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      config-file:
        type: secret
        name: filebrowser-secret
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      cache:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # /srv/users itself is container-local; only the three homes below are NFS. The parent
      # dataset is mode 0771 (traverse, no list), so nothing here depends on listing it.
      users-tscibilia:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/users/tscibilia
        globalMounts:
          - path: /srv/users/tscibilia
      users-samantha:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/users/samantha
        globalMounts:
          - path: /srv/users/samantha
      users-alice:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/users/alice
        globalMounts:
          - path: /srv/users/alice
      docs:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/docs
        globalMounts:
          - path: /srv/docs
      system:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/system
        globalMounts:
          - path: /srv/system
      strata:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/work/strata
        globalMounts:
          - path: /srv/strata
      grey:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/work/grey
        globalMounts:
          - path: /srv/grey
      nadesign:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/work/nadesign
        globalMounts:
          - path: /srv/nadesign
