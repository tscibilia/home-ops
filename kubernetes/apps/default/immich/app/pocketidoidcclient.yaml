---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
spec:
  name: Immich
  callbackUrls:
    - "app.immich:///oauth-callback"
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/auth/login"
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/user-settings"
    - "http://immich-app.default.svc.cluster.local:2283/auth/login"
    - "http://immich-app.default.svc.cluster.local:2283/user-settings"
  pkceEnabled: true
  # No instanceSelector: the PocketIDInstance carries no app.kubernetes.io/name
  # label (verified live — only Flux's kustomize.toolkit.fluxcd.io/* labels are
  # present), so any matchLabels selector here matches nothing and the client
  # never gets a secret. There is exactly one PocketIDInstance in this cluster;
  # the operator's default-instance fallback (proven working via pangolin's
  # client) is what actually resolves this.
  allowedUserGroups:
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
    - name: id-friends
      namespace: security
  secret:
    enabled: true
    name: immich-oidc-secret
    keys:
      clientID: IMMICH_OIDC_CLIENT_ID
      clientSecret: IMMICH_OIDC_CLIENT_SECRET
      issuerUrl: IMMICH_OIDC_ISSUER_URL
