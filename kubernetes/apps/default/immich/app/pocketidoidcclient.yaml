---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
spec:
  name: Immich
  callbackUrls:
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/auth/login"
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/user-settings"
    - "app.immich:///oauth-callback"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  pkceEnabled: true
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
    - name: id-friends
      namespace: security
  secret:
    enabled: true
    name: immich-oidc-secret
    keys:
      clientID: IMMICH_OIDC_CLIENT_ID
      clientSecret: IMMICH_OIDC_CLIENT_SECRET
      # Immich's "Issuer URL" field actually wants the full discovery
      # document URL (pocket-id's own immich integration guide pastes
      # its "OIDC Discovery URL" here), not the bare issuer.
      discoveryUrl: IMMICH_OIDC_ISSUER_URL
