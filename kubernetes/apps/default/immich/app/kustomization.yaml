---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/component_v1alpha1.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./resourceclaimtemplate.yaml
  - ./horizontalpodautoscaler.yaml
  - ./grafanaalert.yaml
  - ./pocketidoidcclient.yaml
  - ./pushsecret.yaml
configMapGenerator:
  - name: immich-config-tpl
    files:
      - ./resources/immich-config.yaml
configurations:
  - ./resources/kustomizeconfig.yaml
generatorOptions:
  disableNameSuffixHash: true
