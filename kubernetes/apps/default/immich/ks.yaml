---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
spec:
  components:
    - ../../../../components/cnpg
    # Uses separate app/horizontalpodautoscaler.yaml for immich-server
  dependsOn:
    - name: cnpg-pgvector-cluster
      namespace: database
    - name: dragonfly-cluster
      namespace: database
    - name: secret-stores
      namespace: external-secrets
    - name: pocket-id
      namespace: security
  interval: 1h
  retryInterval: 5m
  path: ./kubernetes/apps/default/immich/app
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: img
      GATUS_PATH: /api/server/ping
      CNPG_NAME: &postgresAppName pgvector-cluster
      PG_VER: "17"
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: &postgresVersion postgresql.cnpg.io/v1
      kind: &postgresKind Cluster
      name: *postgresAppName
      namespace: database
  healthCheckExprs:
    - apiVersion: *postgresVersion
      kind: *postgresKind
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich-public-proxy
spec:
  dependsOn:
    - name: immich
  interval: 1h
  path: ./kubernetes/apps/default/immich/tools
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: photos
      GATUS_PATH: /share/healthcheck
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
