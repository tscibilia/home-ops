---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanaalertrulegroup_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: actual-auto-sync-alerts
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: Logs
  interval: 5m
  rules:
    - uid: actual-auto-sync-error
      title: ActualAutoSyncError
      condition: C
      data:
        - refId: A
          queryType: stats
          relativeTimeRange:
            from: 21600
            to: 0
          datasourceUid: victorialogs
          model:
            queryType: stats
            # VictoriaLogs query syntax — alert only on runs that end failed.
            # Transient per-attempt timeouts ("Failed syncing account …") are
            # retried by the app and routinely recover; the strings below are
            # logged only when all attempts (hardcoded 2) are exhausted or the
            # whole sync cycle fails.
            expr: |
              app: "actual-auto-sync" | _msg:~"after retries"
                | union (app: "actual-auto-sync" | _msg:~"did not complete successfully")
                | stats count() as count
            intervalMs: 60000
            maxDataPoints: 43200

        - refId: B
          queryType: ""
          relativeTimeRange:
            from: 21600
            to: 0
          datasourceUid: __expr__
          model:
            # Count log lines
            type: reduce
            expression: A
            reducer: sum

        - refId: C
          queryType: ""
          relativeTimeRange:
            from: 21600
            to: 0
          datasourceUid: __expr__
          model:
            # Threshold: alert if count > 0
            type: threshold
            expression: B
            conditions:
              - evaluator:
                  params:
                    - 0
                  type: gt
                operator:
                  type: and
      annotations:
        summary: "Sync run failed in actual-auto-sync"
        description: "An actual-auto-sync run ended in failure (all retry attempts exhausted or the sync cycle did not complete). Check logs for details."
      labels:
        severity: critical
        app: actual-auto-sync
      for: 0m
      noDataState: OK
      execErrState: Error
