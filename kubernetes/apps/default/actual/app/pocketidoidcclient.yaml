---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: actual-budget
spec:
  name: Actual Budget
  callbackUrls:
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/openid/callback"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  pkceEnabled: true
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
  secret:
    enabled: true
    name: actual-oidc-secret
    keys:
      clientID: ACTUAL_OPENID_CLIENT_ID
      clientSecret: ACTUAL_OPENID_CLIENT_SECRET
      discoveryUrl: ACTUAL_OPENID_DISCOVERY_URL
