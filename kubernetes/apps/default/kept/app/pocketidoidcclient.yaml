---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kept
spec:
  name: Kept
  callbackUrls:
    # AUTH_BASE_PATH + /callback/<provider id>, per apps/server/src/auth/oidc.ts.
    - "https://kept.${SECRET_DOMAIN}/api/v1/auth/callback/oidc"
  launchUrl: "https://kept.${SECRET_DOMAIN}/"
  # Kept's OIDC flow sends a code_challenge (pkce: true in oidc.ts).
  pkceEnabled: true
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
  secret:
    enabled: true
    name: kept-oidc-secret
    keys:
      clientID: KEPT_OIDC_CLIENT_ID
      clientSecret: KEPT_OIDC_CLIENT_SECRET
      issuerUrl: KEPT_OIDC_ISSUER
