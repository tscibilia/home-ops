---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kept
spec:
  components:
    - ../../../../components/cnpg
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: secret-stores
      namespace: external-secrets
    - name: cnpg-pgcluster-vector
      namespace: database
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id
      namespace: security
  interval: 1h
  retryInterval: 5m
  path: ./kubernetes/apps/default/kept/app
  postBuild:
    substitute:
      APP: *app
      CNPG_NAME: &postgresAppName pgcluster-vector
      KOPIUR_CAPACITY: 20Gi
      # Kept runs as 10001, so the kopiur mover has to read as 10001 too.
      KOPIUR_PUID: "10001"
      KOPIUR_PGID: "10001"
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: &postgresVersion postgresql.cnpg.io/v1
      kind: &postgresKind Cluster
      name: *postgresAppName
      namespace: database
  healthCheckExprs:
    - apiVersion: *postgresVersion
      kind: *postgresKind
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  patches:
    # The cnpg component dumps as ${APP} (kept), which has no RLS policy; kept_owner has
    # owner_all on every table, and --enable-row-security lets pg_dump read through it.
    - target:
        kind: CronJob
        name: kept-pg-backups
      patch: |
        - op: replace
          path: /spec/jobTemplate/spec/template/spec/containers/0/env/2
          value:
            name: POSTGRES_USER
            value: kept_owner
        - op: replace
          path: /spec/jobTemplate/spec/template/spec/containers/0/env/3
          value:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kept-db
                key: KEPT_DB_OWNER_PASSWORD
        - op: add
          path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
          value:
            name: POSTGRES_EXTRA_OPTS
            value: --enable-row-security
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
