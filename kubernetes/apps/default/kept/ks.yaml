---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kept
spec:
  components:
    - ../../../../components/cnpg
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: secret-stores
      namespace: external-secrets
    - name: cnpg-pgcluster-vector
      namespace: database
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id
      namespace: security
  interval: 1h
  retryInterval: 5m
  path: ./kubernetes/apps/default/kept/app
  postBuild:
    substitute:
      APP: *app
      CNPG_NAME: &postgresAppName pgcluster-vector
      KOPIUR_CAPACITY: 20Gi
      # Kept runs as 10001, so the kopiur mover has to read as 10001 too.
      KOPIUR_PUID: "10001"
      KOPIUR_PGID: "10001"
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: &postgresVersion postgresql.cnpg.io/v1
      kind: &postgresKind Cluster
      name: *postgresAppName
      namespace: database
  healthCheckExprs:
    - apiVersion: *postgresVersion
      kind: *postgresKind
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
