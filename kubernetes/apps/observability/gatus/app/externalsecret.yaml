---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name gatus-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        PUSHOVER_ALERTMANAGER_TOKEN: "{{ .PUSHOVER_ALERTMANAGER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        DB_URI: "postgresql://${APP}:{{ .gatus_postgres_password }}@${CNPG_NAME:=pgcluster-default}-rw.database.svc.cluster.local:5432/${APP}"
  dataFrom:
    - extract:
        key: /observability/gatus
    - extract:
        key: /database/cnpg-users
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  # Seeds the CNPG role password so it never has to be created by hand. The
  # generator is stateless, so refreshInterval "0" is what pins the value.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
