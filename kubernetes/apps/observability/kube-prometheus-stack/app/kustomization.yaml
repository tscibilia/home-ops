---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./alertmanagerconfig.yaml
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
  - ./securitypolicy.yaml
  - ./scrapeconfigs
configMapGenerator:
  - name: flux-metrics-configmap
    files:
      - flux-metrics.yaml=./resources/flux-metrics.yaml
generatorOptions:
  disableNameSuffixHash: true
