---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: remote-hosts-rules
spec:
  groups:
    - name: remote-hosts.rules
      rules:
        - alert: RemoteHostDown
          expr: up{job="node-exporter-remote"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Remote host {{ $labels.instance }} is down"
            description: "node-exporter on {{ $labels.instance }} is unreachable. The host may be offline."
        # Needs a cluster of lines, not one: `rate(...) > 0` stayed above zero
        # for a full 5m window after a single log line.
        # `>= 3`, not `> 2`: increase() extrapolates the partial window, so two
        # lines score 2.14 at a 1m scrape and would page.
        - alert: RemoteContainerLogErrors
          expr: increase(log_metric_counter_container_log_errors_total[15m]) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container errors on {{ $labels.instance }}: {{ $labels.container }}"
            description: "Repeated error log lines in container {{ $labels.container }} on {{ $labels.instance }}."
        - alert: RemoteContainerLogWarnings
          expr: rate(log_metric_counter_container_log_warnings_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Sustained warnings on {{ $labels.instance }}: {{ $labels.container }}"
            description: "Container {{ $labels.container }} on {{ $labels.instance }} has been emitting warnings for 5m."
        - alert: RemoteHostDiskPressure
          expr: (node_filesystem_avail_bytes{job="node-exporter-remote",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) < 0.10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Disk almost full on {{ $labels.instance }}: {{ $labels.mountpoint }}"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free."
    # Driven by the services' own metrics rather than by log scraping.
    - name: vps-services.rules
      rules:
        - alert: TowonelEdgeNoSessions
          expr: towonel_edge_active_sessions == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "towonel edge has no agent sessions"
            description: "No in-cluster towonel agent is registered with the VPS edge. Everything published through the tunnel is unreachable."
        - alert: TowonelEdgeRouteNoSession
          expr: rate(towonel_edge_route_no_session_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "towonel edge routing to a missing agent session"
            description: "Requests are reaching the edge with no session registered for the target agent, so clients are seeing failures."
        - alert: TowonelEdgeOverload
          expr: rate(towonel_edge_connections_rejected_overload_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "towonel edge rejecting connections ({{ $labels.reason }})"
            description: "The {{ $labels.reason }} concurrency cap is saturating. Sustained values mean an accept-time DoS or an undersized cap."
        - alert: TowonelHubServerErrors
          expr: rate(towonel_hub_requests_total{status=~"5.."}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "towonel hub returning 5xx on {{ $labels.endpoint }}"
            description: "The hub control-plane API is failing on {{ $labels.endpoint }}."
        - alert: DocoCdPollErrors
          expr: increase(doco_cd_poll_errors_total[30m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "doco-cd is failing to converge {{ $labels.repository }}"
            description: "doco-cd polling or deployment is erroring, so VPS stacks are drifting from git. Check `docker logs doco-cd`."
