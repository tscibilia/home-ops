---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: guacamole
spec:
  name: Guacamole
  callbackUrls:
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  pkceEnabled: true
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
    - name: id-friends
      namespace: security
  secret:
    enabled: true
    name: guacamole-oidc-secret
    keys:
      clientID: OPENID_CLIENT_ID
      authorizationUrl: OPENID_AUTHORIZATION_ENDPOINT
      jwksUrl: OPENID_JWKS_ENDPOINT
      issuerUrl: OPENID_ISSUER
