---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name guacamole-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        # PostgreSQL configuration
        POSTGRESQL_HOSTNAME: "${CNPG_NAME:=pgsql-cluster}-rw.database.svc.cluster.local"
        POSTGRESQL_DATABASE: "${APP}"
        POSTGRESQL_USERNAME: "${APP}"
        POSTGRESQL_PASSWORD: "{{ .${APP}_postgres_password }}"
        # Guacd daemon configuration
        GUACD_HOSTNAME: guacd.observability.svc.cluster.local
        GUACD_PORT: "4822"
        # OpenID Connect (Pocket ID) configuration
        OPENID_REDIRECT_URI: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
        OPENID_USERNAME_CLAIM_TYPE: "preferred_username"
        OPENID_SCOPE: "openid profile groups email"
  dataFrom:
    - extract:
        key: /database/cnpg-users
