---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: bookorbit
spec:
  name: BookOrbit
  callbackUrls:
    # Web login flow, per https://bookorbit.app/oidc/#redirect-uri.
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/oauth2-callback"
    # Fixed redirect URI required by the official iOS app; do not change.
    - "bookorbit://oauth2-callback"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  # BookOrbit's login flow uses PKCE (code_verifier is generated in-browser).
  pkceEnabled: true
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
  secret:
    enabled: true
    name: bookorbit-oidc-secret
    keys:
      # Not consumed by the container: BookOrbit stores its OIDC provider
      # configuration in its database (Settings > OIDC / SSO). The secret
      # exists so the PushSecret below backs the credentials up to aKeyless
      # and the values are available at /security/pocket-id-clients.
      clientID: BOOKORBIT_OIDC_CLIENT_ID
      clientSecret: BOOKORBIT_OIDC_CLIENT_SECRET
      issuerUrl: BOOKORBIT_OIDC_ISSUER
