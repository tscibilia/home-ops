---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: &name bookorbit-oidc-secret
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: akeyless-secret-store
  selector:
    secret:
      name: *name
  data:
    - match:
        secretKey: BOOKORBIT_OIDC_CLIENT_ID
        remoteRef:
          remoteKey: /security/pocket-id-clients
          property: BOOKORBIT_OIDC_CLIENT_ID
    - match:
        secretKey: BOOKORBIT_OIDC_CLIENT_SECRET
        remoteRef:
          remoteKey: /security/pocket-id-clients
          property: BOOKORBIT_OIDC_CLIENT_SECRET
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: &name "${APP}-readaloud-token"
spec:
  refreshInterval: 1h
  # IfNotExists: aKeyless keeps the first value, so a regenerated secret never
  # silently overwrites the recorded one
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: akeyless-secret-store
  selector:
    secret:
      name: *name
  data:
    - match:
        secretKey: READ_ALOUD_WORKER_TOKEN
        remoteRef:
          remoteKey: /media/bookorbit
          property: BOOKORBIT_READ_ALOUD_WORKER_TOKEN
