---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookorbit
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    configMaps:
      initdb:
        data:
          bookorbit.sql: |
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            CREATE EXTENSION IF NOT EXISTS "pg_trgm";
            CREATE EXTENSION IF NOT EXISTS "vector";
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.1.0@sha256:78b6eac18306eb7eba0dbf6592ecdee01b15f24de9a941cb853db4a0232d7999
            env:
              APP_URL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              CLIENT_URL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              NODE_ENV: production
              NODE_MAX_OLD_SPACE_SIZE: 2048
              OIDC_ALLOW_LOCAL_ISSUERS: true
              DISABLE_LOCAL_AUTH: true
              PORT: &port 3000
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      initdb:
        type: configMap
        identifier: initdb
        advancedMounts:
          *app :
            01-init-db:
              - path: /initdb
      data:
        existingClaim: *app
        advancedMounts:
          *app :
            app:
              - path: /data
      library:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/media
        advancedMounts:
          *app :
            app:
              - path: /library
                subPath: books
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
