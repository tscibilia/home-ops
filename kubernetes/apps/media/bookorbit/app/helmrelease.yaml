---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookorbit
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    configMaps:
      initdb:
        data:
          bookorbit.sql: |
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            CREATE EXTENSION IF NOT EXISTS "pg_trgm";
            CREATE EXTENSION IF NOT EXISTS "vector";
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.8.0@sha256:d318f7732f6f6330312e2c5f854f7899f858b54cc4b18a13cde1f43b5bea0515
            env:
              APP_URL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              CLIENT_URL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              NODE_ENV: production
              NODE_MAX_OLD_SPACE_SIZE: 2048
              OIDC_ALLOW_LOCAL_ISSUERS: true
              DISABLE_LOCAL_AUTH: true
              PORT: &port 3000
              READ_ALOUD_WORKER_URL: http://127.0.0.1:8787
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              # READ_ALOUD_WORKER_TOKEN; the worker reads the same secret
              - secretRef:
                  name: "{{ .Release.Name }}-readaloud-token"
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: &containerSecurityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
          read-aloud-worker:
            image:
              repository: ghcr.io/bookorbit/bookorbit-read-aloud-worker
              tag: 3.8.0@sha256:830f4ea19d3ff74c53526a470525da926f5a2cd751c636eb2abdfb95c19d57a8
            env:
              READ_ALOUD_LIBRARY_ROOTS: /library
              # Must equal the server's <APP_DATA_PATH>/read-aloud/jobs
              READ_ALOUD_WORK_ROOT: /data/read-aloud/jobs
              # The Docker image has neither CUDA nor a WebGPU driver
              READ_ALOUD_CTC_DEVICE: cpu
              READ_ALOUD_WORKER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-readaloud-token"
                    key: READ_ALOUD_WORKER_TOKEN
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Inference uses every core it can see; keep it off the node's throat
                cpu: 4
                memory: 4Gi
            # /health needs the bearer token, so probe the port
            probes:
              liveness: &workerProbes
                enabled: true
                custom: true
                spec: &workerProbeSpec
                  tcpSocket:
                    port: 8787
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                <<: *workerProbes
                spec:
                  <<: *workerProbeSpec
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  <<: *workerProbeSpec
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext: *containerSecurityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      initdb:
        type: configMap
        identifier: initdb
        advancedMounts:
          *app :
            01-init-db:
              - path: /initdb
      data:
        existingClaim: *app
        advancedMounts:
          *app :
            app:
              - path: /data
            # The worker sees only the server's <APP_DATA_PATH>/read-aloud
            read-aloud-worker:
              - path: /data/read-aloud
                subPath: read-aloud
      library:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/media
        advancedMounts:
          *app :
            app:
              - path: /library
                subPath: books
            # Same path as the server; it resolves book files by those paths
            read-aloud-worker:
              - path: /library
                subPath: books
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
