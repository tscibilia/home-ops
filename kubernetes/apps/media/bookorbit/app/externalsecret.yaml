---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name bookorbit-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        DATABASE_URL: "postgres://${APP}:{{ .${APP}_postgres_password }}@${CNPG_NAME:=pgcluster-default}-rw.database.svc.cluster.local:5432/${APP}?sslmode=disable"
        JWT_SECRET: "{{ .BOOKORBIT_JWT_SECRET }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .BOOKORBIT_BOOTSTRAP_TOKEN }}"
        BOOK_REQUEST_ENCRYPTION_KEY: "{{ .BOOKORBIT_BOOK_REQUEST_TOKEN }}"
  dataFrom:
    - extract:
        key: /media/bookorbit
    - extract:
        key: /database/cnpg-users
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-readaloud-token"
spec:
  # Seeds the server/worker shared token instead of a manual aKeyless task. The
  # generator is stateless, so refreshInterval "0" is what pins the value; the
  # pushed copy in aKeyless (pushsecret.yaml) is the durable record.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        READ_ALOUD_WORKER_TOKEN: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  # Seeds the CNPG role password so it never has to be created by hand. The
  # generator is stateless, so refreshInterval "0" is what pins the value.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
