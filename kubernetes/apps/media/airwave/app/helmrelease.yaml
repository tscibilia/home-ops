---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app airwave
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
        containers:
          app:
            image: &image
              repository: ghcr.io/quixomatic/airwave
              tag: 0.12.28@sha256:bc8b79f344e2cae9d0226cc2d48b18d4c4f045bb9ca9b231703fc1b3e3fbcb3a
            env:
              CG_ROLE: server
              TZ: &TZ "${TIMEZONE:-UTC}"
              PORT: &serverPort 3000
              BETTER_AUTH_URL: &serverUrl https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}
              CORS_ORIGIN: https://${GATUS_SUBDOMAIN}-admin.${SECRET_DOMAIN}
              TV_APP_ORIGIN: https://${GATUS_SUBDOMAIN}web.${SECRET_DOMAIN}
              BUMPER_MUSIC_DIR: &bumperDir /data/bumper-music
              PUID: &puid 1000
              PGID: &pgid 1000
              UMASK: &umask "022"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: /api/health
                    port: *serverPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup: &startupProbe
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # entrypoint rewrites /etc at start (localtime link, timezone, usermod)
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *image
            env:
              CG_ROLE: web
              TZ: *TZ
              WEB_PORT: &webPort 3001
              VITE_SERVER_URL: *serverUrl
              PUID: *puid
              PGID: *pgid
              UMASK: *umask
            resources:
              requests:
                cpu: 20m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  httpGet:
                    path: &healthPath /
                    port: *webPort
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
                  httpGet:
                    path: *healthPath
                    port: *webPort
              startup: *startupProbe
            securityContext: &buildSecurityContext
              allowPrivilegeEscalation: false
              # vite writes its build output inside the image at startup.
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
      tvweb:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *image
            env:
              CG_ROLE: tvweb
              TZ: *TZ
              TV_WEB_PORT: &tvwebPort 3002
              VITE_SERVER_URL: *serverUrl
              PUID: *puid
              PGID: *pgid
              UMASK: *umask
            resources:
              requests:
                cpu: 20m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  httpGet:
                    path: *healthPath
                    port: *tvwebPort
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
                  httpGet:
                    path: *healthPath
                    port: *tvwebPort
              startup: *startupProbe
            securityContext: *buildSecurityContext
    defaultPodOptions:
      annotations:
        # entrypoint replaces /etc/localtime; k8tz mounting it there makes the ln -snf fail
        k8tz.io/inject: "false"
      securityContext:
        runAsNonRoot: true
        runAsUser: *puid
        runAsGroup: *pgid
        fsGroup: *pgid
        fsGroupChangePolicy: OnRootMismatch
    service:
      server:
        controller: server
        ports:
          http:
            port: *serverPort
      web:
        controller: web
        ports:
          http:
            port: *webPort
      tvweb:
        controller: tvweb
        ports:
          http:
            port: *tvwebPort
    route:
      server:
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: server
                port: *serverPort
      web:
        hostnames: ["${GATUS_SUBDOMAIN}-admin.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: web
                port: *webPort
      tvweb:
        hostnames: ["${GATUS_SUBDOMAIN}web.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: tvweb
                port: *tvwebPort
    persistence:
      # emptyDir: uploaded bumper tracks are lost on restart. Swap for NFS or PVC
      bumper-music:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: *bumperDir
      tmp:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /tmp
