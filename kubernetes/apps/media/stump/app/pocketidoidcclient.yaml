---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: stump
spec:
  name: Stump
  callbackUrls:
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/api/v2/auth/oidc/callback"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  pkceEnabled: false
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
  secret:
    enabled: true
    name: stump-oidc-secret
    keys:
      clientID: STUMP_OIDC_CLIENT_ID
      clientSecret: STUMP_OIDC_CLIENT_SECRET
      issuerUrl: STUMP_OIDC_ISSUER_URL
