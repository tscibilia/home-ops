---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: bookboss
spec:
  name: BookBoss
  callbackUrls:
    - "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/api/auth/callback"
  launchUrl: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
  pkceEnabled: false
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-home
      namespace: security
    - name: id-family
      namespace: security
  secret:
    enabled: true
    name: bookboss-oidc-secret
    keys:
      clientID: BOOKBOSS__OIDC__CLIENT_ID
      clientSecret: BOOKBOSS__OIDC__CLIENT_SECRET
      issuerUrl: BOOKBOSS__OIDC__ISSUER_URL
