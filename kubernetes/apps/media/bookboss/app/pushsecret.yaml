---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: &name "${APP}-pgpass"
spec:
  refreshInterval: 1h
  # IfNotExists makes aKeyless the source of truth after the first write
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: akeyless-secret-store
  selector:
    secret:
      name: *name
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /database/cnpg-users
          property: ${APP}_postgres_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: bookboss-oidc-secret
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: akeyless-secret-store
  selector:
    secret:
      name: bookboss-oidc-secret
  data:
    - match:
        secretKey: BOOKBOSS__OIDC__CLIENT_ID
        remoteRef:
          remoteKey: /security/pocket-id-clients
          property: BOOKBOSS__OIDC__CLIENT_ID
    - match:
        secretKey: BOOKBOSS__OIDC__CLIENT_SECRET
        remoteRef:
          remoteKey: /security/pocket-id-clients
          property: BOOKBOSS__OIDC__CLIENT_SECRET
