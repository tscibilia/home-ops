---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: snapshot-controller
      namespace: kube-system
  values:
    operatorNamespace: rook-ceph
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      healthCheck:
        # CSI keys are pinned to aes below, so these four can never clear on their
        # own. Unmute once nodes reach kernel 7.0+ and CSI moves to aes256k.
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE: &mute
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED: *mute
          AUTH_INSECURE_KEYS_CREATABLE: *mute
          # Surfaces transiently for 2-3h after daemon keys rotate.
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE: *mute
        daemonHealth:
          mon:
            disabled: false
            interval: 45s
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      network:
        provider: host
        addressRanges:
          public:
            - 192.168.5.0/24
          cluster:
            - 192.168.43.0/24
        connections:
          requireMsgr2: true
      resources:
        osd:
          limits:
            memory: 8Gi
      security:
        cephx:
          # One-shot rotation: bump keyGeneration again to rotate a second time.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyType: aes # aes256k needs kernel 7.0+; nodes are on 6.18
      storage:
        config:
          osdsPerDevice: "1"
        devicePathFilter: /dev/disk/by-id/ata-SAMSUNG*
        useAllDevices: false
        useAllNodes: true
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: "rook.${SECRET_DOMAIN}"
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-ssd
          allowVolumeExpansion: true
          isDefault: true
          mountOptions:
            - discard
          parameters:
            compression_algorithm: zstd
            compression_mode: passive
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            imageFormat: "2"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      deletionPolicy: Delete
      isDefault: true
    cephFileSystems: []
    cephObjectStores: []
