---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &name pgcluster-timescale
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: timescaledb
    major: 18
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  postgresGID: 1000
  postgresUID: 1000
  storage:
    size: 10Gi
    storageClass: openebs-hostpath

  # # Note: this is needed when recovering from an existing cnpg cluster
  # # https://cloudnative-pg.io/plugin-barman-cloud/docs/usage/#restoring-a-cluster
  # bootstrap:
  #   recovery:
  #     source: source
  #     # Only needed for point-in-time recovery
  #     recoveryTarget:
  #       backupID: 20260211T074937
  # externalClusters:
  #   - name: source
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: *name
  #         serverName: *name

  superuserSecret:
    name: cnpg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      # drop_chunks locks all ~4.2k library_snapshots chunks plus indexes in one transaction
      max_locks_per_transaction: "512"
    pg_hba: ["host all all 10.42.0.0/16 scram-sha-256"]
    shared_preload_libraries: ["timescaledb"]
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  monitoring:
    enablePodMonitor: true
  # enablePDB replaces nodeMaintenanceWindow https://cloudnative-pg.io/documentation/1.26/kubernetes_upgrade/#pod-disruption-budgets
  enablePDB: true
  # Fix for non AWS backup https://github.com/cloudnative-pg/cloudnative-pg/issues/7715#issuecomment-2935582020
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
    - name: TZ
      value: ${TIMEZONE:-UTC}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: *name
        serverName: *name
