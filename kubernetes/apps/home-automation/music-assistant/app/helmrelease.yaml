---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app music-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # MA auto-detects the publish IP from the default route, which is the pod's
          # cluster interface. Seed the IOT address (players) and the external URL
          # (auto-generated links, e.g. Spotify redirects) before the app starts.
          seed-config:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.11@sha256:b14d5c1c93d776f33b9670a3c6febe3f072566d7b2f4f431a09dcca79bd8ac05
            command:
              - /app/venv/bin/python
              - -c
              - |
                import json, os
                path = "/data/settings.json"
                data = {}
                if os.path.exists(path):
                    with open(path) as f:
                        data = json.load(f)
                core = data.setdefault("core", {})
                seed = {
                    "streams": {"publish_ip": "192.168.107.54"},
                    "webserver": {"base_url": "https://mass.t0m.co"},
                }
                for domain, values in seed.items():
                    block = core.setdefault(domain, {})
                    block.setdefault("domain", domain)
                    values_block = block.setdefault("values", {})
                    for key, value in values.items():
                        values_block.setdefault(key, value)
                with open(path, "w") as f:
                    json.dump(data, f, indent=2)
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.11@sha256:b14d5c1c93d776f33b9670a3c6febe3f072566d7b2f4f431a09dcca79bd8ac05
            command:
              - /usr/local/bin/entrypoint.sh
              - --data-dir
              - /data
              - --cache-dir
              - /cache
            env:
              LOG_LEVEL: info
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: /
                    port: &port 8095
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                <<: *probes
                spec:
                  <<: *probeSpec
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "iot",
                "namespace": "network",
                "ips": ["192.168.107.54/24"],
                "mac": "02:7f:b4:4d:54:01"
              }]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid 1000
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
          stream:
            port: 8097
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      media:
        type: nfs
        server: truenas.internal
        path: /mnt/nas/data/media
        globalMounts:
          - path: /media
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
