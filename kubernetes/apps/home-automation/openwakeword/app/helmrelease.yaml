---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openwakeword
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mirror.gcr.io/rhasspy/wyoming-openwakeword
              tag: 2.1.0@sha256:52cb1168731a1849fc28cf339c935fde58746bbabc94226668a40ef6ddf5d42b
            args:
              - --uri
              - tcp://0.0.0.0:10400
              - --preload-model
              - "ok_nabu"
              - --custom-model-dir
              - /custom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  tcpSocket:
                    port: &port 10400
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                <<: *probes
                spec:
                  <<: *probeSpec
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          annotations:
            external-dns.kubernetes.io/hostname: "{{ .Release.Name }}.internal"
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name": "iot",
                "namespace": "network",
                "ips": ["192.168.107.57/24"],
                "mac": "02:7f:b4:4d:57:57"
              }]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatchh
    service:
      app:
        controller: *app
        ports:
          wyoming:
            protocol: TCP
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: configMap
        name: openwakeword-config
        globalMounts:
          - path: /custom
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
