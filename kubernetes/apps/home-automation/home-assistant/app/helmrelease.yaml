---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
  labels:
    app.kubernetes.io/sidecar: &sidecar code-server
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          copy-soco-fix:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            command:
              - sh
              - -c
              - |
                mkdir -p /config/custom_components/soco_ip_fix
                cp /soco-config/manifest.json /config/custom_components/soco_ip_fix/
                cp /soco-config/__init__.py /config/custom_components/soco_ip_fix/
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.3@sha256:96c244d8aa3586026bb8d4fdc0dcf9b34f348874a1ea5060942356cf181177bc
            env:
              HASS_HTTP_TRUSTED_PROXY_1: 10.43.0.0/16
              HASS_HTTP_TRUSTED_PROXY_2: 10.42.0.0/16
              HASS_HTTP_TRUSTED_PROXY_3: 192.168.107.0/24
              HASS_HTTP_TRUSTED_PROXY_4: 192.168.5.0/24
              HASS_HTTP_TRUSTED_PROXY_5: 192.168.1.0/24
              HASS_ADVERTISED_IP: 192.168.107.50
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet:
                    path: /
                    port: 8123
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  periodSeconds: 10
              startup:
                <<: *probes
                spec:
                  <<: *probeSpec
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
        pod:
          annotations:
            external-dns.kubernetes.io/hostname: "{{ .Release.Name }}.internal"
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "iot",
                "namespace": "network",
                "ips": ["192.168.107.50/24", "fda1:107::8bad:f00d/64"],
                "mac": "02:3a:8e:c5:d7:91"
              }]
          dnsConfig:
            options:
              - name: single-request
      *sidecar :
        annotations:
          secret.reloader.stakater.com/reload: "{{ .Release.Name }}-deploykey"
        containers:
          *sidecar :
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9
            env:
              GIT_CONFIG_GLOBAL: /mnt/code-server/.gitconfig
              GIT_SSH_COMMAND: ssh -i /home/coder/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /mnt/code-server
              - --extensions-dir
              - /mnt/code-server
              - --port
              - "12321"
              - /config
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 12321
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 12321
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 12321
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: *app
                      app.kubernetes.io/name: *app
                  topologyKey: kubernetes.io/hostname
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "{{.Release.Name}}"
        controller: *app
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 8123
      *sidecar :
        controller: *sidecar
        ports:
          http:
            port: 12321
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames: ["${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
      *sidecar :
        hostnames: ["ha-code.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: *sidecar
    # Custom component to fix Sonos SoCo library binding to pod IP instead of Multus IOT IP.
    # Sets soco.config.EVENT_LISTENER_IP so Sonos speakers can reach HA for event callbacks.
    configMaps:
      soco-config:
        data:
          manifest.json: |
            {
              "domain": "soco_ip_fix",
              "name": "Soco IP Fix",
              "version": "1.0.0",
              "codeowners": [],
              "dependencies": [],
              "requirements": []
            }
          __init__.py: |
            import soco.config
            soco.config.EVENT_LISTENER_IP = "192.168.107.50"

            async def async_setup(hass, config):
                return True
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          *app :
            copy-soco-fix:
              - path: /config
            app:
              - path: /config
          *sidecar :
            *sidecar :
              - path: /config
              - path: /mnt/code-server
                subPath: code-server
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        advancedMounts:
          *app :
            app:
              - path: /config/.venv
      tmp:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /tmp
                subPath: home-assistant-tmp
          *sidecar :
            *sidecar :
              - path: /tmp
                subPath: code-server-tmp
              - path: /nonexistent
                subPath: nonexistent
      soco-config:
        type: configMap
        name: home-assistant
        advancedMounts:
          *app :
            copy-soco-fix:
              - path: /soco-config
      deploy-key:
        type: secret
        name: home-assistant-deploykey
        defaultMode: 256
        advancedMounts:
          *sidecar :
            *sidecar :
              - path: /home/coder/.ssh/id_ed25519
                subPath: id_ed25519
