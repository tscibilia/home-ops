- name: Bootstrap clonenas doco-cd
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_user: sysadmin
    ansible_python_interpreter: auto_silent
    ansible_remote_tmp: /tmp
    dococd_config_dir: /mnt/vault/sysadmin/.config/doco-cd

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping:

    - name: Read secrets from aKeyless
      ansible.builtin.shell: "akeyless get-secret-value --name '{{ item }}'"
      delegate_to: localhost
      become: false
      loop:
        - docker/doco-cd/github-token
        - docker/doco-cd/akeyless-access-id
        - docker/doco-cd/akeyless-access-key
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_github_token: "{{ secrets_raw.results[0].stdout }}"
        doco_akeyless_access_id: "{{ secrets_raw.results[1].stdout }}"
        doco_akeyless_access_key: "{{ secrets_raw.results[2].stdout }}"
      no_log: true

    - name: doco-cd | Create config directory
      ansible.builtin.shell:
        cmd: mkdir -p {{ dococd_config_dir | quote }}
        creates: "{{ dococd_config_dir }}"
      become: false

    - name: doco-cd | Ensure doco-cd_data volume exists
      ansible.builtin.shell: docker volume inspect doco-cd_data >/dev/null 2>&1 || docker volume create doco-cd_data
      changed_when: false

    # doco-cd now deploys its own stack from the repository (issue #4321). The
    # midclt job below was the nightly self-updater; remove it if it survives on
    # a host that has not been cleaned by hand yet.
    - name: doco-cd | Remove the retired nightly updater
      ansible.builtin.shell: |
        ids=$(midclt call cronjob.query '[["description","=","doco-cd self update"]]' \
          | python3 -c 'import json,sys;print(" ".join(str(j["id"]) for j in json.load(sys.stdin)))')
        for job_id in $ids; do midclt call cronjob.delete "$job_id" > /dev/null; done
      changed_when: false

    - name: smart | Install weekly short SMART test
      ansible.builtin.shell: |
        result=$(midclt call cronjob.query '[["description","=","SMART Test: Short"]]')
        [ "$result" = "[]" ] || exit 0
        python3 <<'EOF'
        import subprocess, json
        job = {
            "user": "root",
            "command": 'midclt call disk.smart_test SHORT ["*"]',
            "description": "SMART Test: Short",
            "schedule": {"minute": "0", "hour": "1", "dom": "*", "month": "*", "dow": "0"},
            "enabled": True,
            "stdout": True,
            "stderr": False,
        }
        subprocess.run(["midclt", "call", "cronjob.create", json.dumps(job)], check=True)
        EOF
      changed_when: false

    - name: smart | Install monthly long SMART test
      ansible.builtin.shell: |
        result=$(midclt call cronjob.query '[["description","=","SMART Test: Long"]]')
        [ "$result" = "[]" ] || exit 0
        python3 <<'EOF'
        import subprocess, json
        job = {
            "user": "root",
            "command": 'midclt call disk.smart_test LONG ["*"]',
            "description": "SMART Test: Long",
            "schedule": {"minute": "0", "hour": "1", "dom": "1", "month": "*", "dow": "*"},
            "enabled": True,
            "stdout": True,
            "stderr": False,
        }
        subprocess.run(["midclt", "call", "cronjob.create", json.dumps(job)], check=True)
        EOF
      changed_when: false

    - name: doco-cd | Create secret files
      ansible.builtin.copy:
        dest: "{{ dococd_config_dir }}/{{ item.name }}"
        content: "{{ item.content }}"
        owner: sysadmin
        unsafe_writes: true
      no_log: true
      loop:
        - name: gh_token
          content: "{{ doco_github_token }}"
        - name: akeyless_access_id
          content: "{{ doco_akeyless_access_id }}"
        - name: akeyless_access_key
          content: "{{ doco_akeyless_access_key }}"

    - name: docker | Install Docker CE
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        executable: /bin/bash
        creates: /usr/bin/docker

    - name: docker | Start and enable Docker daemon
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: docker | Wait for Docker socket
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        state: present
        timeout: 30

    - name: docker | Add sysadmin to docker group
      ansible.builtin.user:
        name: sysadmin
        groups: docker
        append: true

    # community.docker.* modules require the 'docker' Python SDK on the remote
    # host. TrueNAS SCALE's system Python is locked down — pip is unavailable
    # and the SDK cannot be installed. Raw shell + docker CLI is the only
    # reliable approach here as opposed to the VPS playbook running Ubuntu.
    - name: doco-cd | Ensure doco-cd Docker network exists
      ansible.builtin.shell: docker network inspect doco-cd >/dev/null 2>&1 || docker network create doco-cd
      changed_when: false

    - name: doco-cd | Remove retired updater artefacts
      ansible.builtin.file:
        path: "{{ dococd_config_dir }}/{{ item }}"
        state: absent
      loop:
        - cron-update.sh
        - docker-compose.app.yaml
        - update.log
