---
all:
  children:
    truenas:
      hosts:
        truenas.internal:
          ansible_user: sysadmin
          ansible_ssh_private_key_file: ~/.ssh/home-ops
          ansible_python_interpreter: auto_silent
    clonenas:
      hosts:
        clonenas.internal:
          ansible_user: sysadmin
          ansible_ssh_private_key_file: ~/.ssh/home-ops
          ansible_python_interpreter: auto_silent
    vps:
      hosts:
        vps.internal:
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/home-ops
          ansible_python_interpreter: auto_silent
          ansible_port: 22222
    towonel:
      hosts:
        towonel.internal:
          # PLACEHOLDER: the droplet does not exist yet. Gate B fills this in
          # with the droplet's IP once it is created.
          ansible_host: REPLACE_WITH_DROPLET_IP
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          ansible_python_interpreter: auto_silent
          ansible_port: 22222
