---
- name: Bootstrap towonel VPS
  hosts: all
  gather_facts: false
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: auto_silent
    host_ssh_port: 22222
    dococd_config_dir: /opt/doco-cd
    geoblock_dir: /opt/geo-block

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping:

    - name: Read secrets from aKeyless
      ansible.builtin.shell: "akeyless get-secret-value --name '{{ item }}'"
      delegate_to: localhost
      loop:
        - docker/doco-cd/github-token
        - docker/doco-cd/akeyless-access-id
        - docker/doco-cd/akeyless-access-key
        - docker/secret-domain
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_github_token: "{{ secrets_raw.results[0].stdout }}"
        doco_akeyless_access_id: "{{ secrets_raw.results[1].stdout }}"
        doco_akeyless_access_key: "{{ secrets_raw.results[2].stdout }}"
        towonel_base_domain: "{{ secrets_raw.results[3].stdout }}"
      no_log: true

    - name: user
      become: true
      when: bootstrap_mode | default(false)
      tags: user
      block:
        - name: user | Create ubuntu user
          ansible.builtin.user:
            name: ubuntu
            groups: sudo
            shell: /bin/bash
            create_home: true

        - name: user | Add SSH public key
          ansible.posix.authorized_key:
            user: ubuntu
            key: "{{ lookup('file', '~/.ssh/home-ops.pub') }}"

    - name: packages
      become: true
      when: bootstrap_mode | default(false)
      tags: packages
      block:
        - name: packages | Install Docker
          ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
          args:
            executable: /bin/bash
            creates: /usr/bin/docker

        - name: packages | Add ubuntu to docker group
          ansible.builtin.user:
            name: ubuntu
            groups: docker
            append: true

    - name: ssh
      become: true
      when: bootstrap_mode | default(false)
      tags: ssh
      block:
        - name: ssh | Update SSH socket port
          ansible.builtin.replace:
            path: /lib/systemd/system/ssh.socket
            regexp: "^(ListenStream=.+):\\d+$"
            replace: "\\1:{{ host_ssh_port }}"
          notify:
            - Reload systemd daemon
            - Restart ssh.socket

        - name: ssh | Harden sshd_config
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/01-hardening.conf
            content: |
              PermitRootLogin no
              PasswordAuthentication no
              MaxAuthTries 3
              LoginGraceTime 20
            owner: root
            mode: "0644"
          notify: Restart ssh.socket

    - name: firewall
      become: true
      tags: firewall
      block:
        - name: firewall | Allow ports
          community.general.ufw:
            rule: allow
            port: "{{ item.port }}"
            proto: "{{ item.protocol | default('tcp') }}"
          loop:
            - name: SSH hardened
              port: "{{ host_ssh_port }}"
            - name: HTTPS (caddy-l4)
              port: "443"
            - name: towonel hub API
              port: "8443"
            - name: towonel edge iroh
              port: "51820"
              protocol: udp

        - name: firewall | Allow UniFi inform port
          community.general.ufw:
            rule: allow
            port: "4443"
            proto: tcp
          when: unifi_host | default(false)

        # Provider images ship sshd on 22; the bootstrap run needs it to move
        # sshd to {{ host_ssh_port }}. Every non-bootstrap run removes it again.
        - name: firewall | Allow original SSH port during bootstrap
          community.general.ufw:
            rule: allow
            port: "22"
            proto: tcp
          when: bootstrap_mode | default(false)

        - name: firewall | Remove original SSH port allow
          community.general.ufw:
            rule: allow
            port: "22"
            proto: tcp
            delete: true
          when: not (bootstrap_mode | default(false))

        - name: firewall | Enable UFW
          community.general.ufw:
            state: enabled
            policy: deny

    - name: network
      become: false
      tags: network
      block:
        - name: network | Create edge Docker network
          community.docker.docker_network:
            name: edge
            driver: bridge
            state: present

    - name: towonel
      become: true
      tags: towonel
      block:
        - name: towonel | Create data directory
          ansible.builtin.file:
            path: /opt/towonel
            state: directory
            owner: "10001"
            group: "10001"
            mode: "0755"

    - name: doco-cd
      become: false
      tags: doco-cd
      block:
        - name: doco-cd | Create config directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0755"

        - name: doco-cd | Copy docker-compose app file
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/docker-compose.app.yaml
            dest: "{{ dococd_config_dir }}/docker-compose.app.yaml"
            owner: ubuntu
            group: ubuntu
            mode: "0644"

        - name: doco-cd | Copy Dockerfile
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/Dockerfile
            dest: "{{ dococd_config_dir }}/Dockerfile"
            owner: ubuntu
            group: ubuntu
            mode: "0644"

        - name: doco-cd | Copy proxy.py
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/proxy.py
            dest: "{{ dococd_config_dir }}/proxy.py"
            owner: ubuntu
            group: ubuntu
            mode: "0644"

        - name: doco-cd | Copy cron-update.sh
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/cron-update.sh
            dest: "{{ dococd_config_dir }}/cron-update.sh"
            owner: ubuntu
            group: ubuntu
            mode: "0755"

        - name: doco-cd | Install nightly update cron job
          ansible.builtin.cron:
            name: doco-cd stack update
            minute: "0"
            hour: "3"
            job: "{{ dococd_config_dir }}/cron-update.sh"
            user: ubuntu
            state: present

        - name: doco-cd | Create secret files
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: "{{ item.content }}"
            owner: ubuntu
            group: ubuntu
            mode: "0600"
          no_log: true
          loop:
            - name: gh_token
              content: "{{ doco_github_token }}"
            - name: akeyless_access_id
              content: "{{ doco_akeyless_access_id }}"
            - name: akeyless_access_key
              content: "{{ doco_akeyless_access_key }}"

        - name: doco-cd | Run docker-compose
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            files:
              - docker-compose.app.yaml
            build: always
            pull: always
            state: present
          when: not ansible_check_mode

        - name: doco-cd | Wait for akeyless-proxy healthy
          community.docker.docker_container_info:
            name: akeyless-proxy
          register: proxy_info
          until: proxy_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 5
          when: not ansible_check_mode

        - name: doco-cd | Wait for doco-cd healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

    - name: geo-block
      become: true
      tags: geo-block
      block:
        - name: geo-block | Install ipset
          ansible.builtin.apt:
            name: ipset
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: geo-block | Create script directory
          ansible.builtin.file:
            path: "{{ geoblock_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: geo-block | Install update-country-blocks.sh
          ansible.builtin.copy:
            dest: "{{ geoblock_dir }}/update-country-blocks.sh"
            owner: root
            group: root
            mode: "0755"
            content: |
              #!/usr/bin/env bash
              # Managed by ansible/towonel/playbook.yaml -- do not edit on the host.
              # L3 country blocking. TLS passthrough means nothing on this host can
              # read HTTP, so the geo policy has to drop packets before towonel sees
              # them (spec D5).
              set -euo pipefail

              COUNTRIES="RU CN KP IR BY IL"
              SET_NAME="geoblock"
              ZONE_URL="https://www.ipdeny.com/ipblocks/data/aggregated"

              tmp="$(mktemp -d)"
              trap 'rm -rf "${tmp}"' EXIT

              ipset create "${SET_NAME}-new" hash:net -exist
              ipset flush "${SET_NAME}-new"

              for cc in ${COUNTRIES}; do
                lc="$(echo "${cc}" | tr '[:upper:]' '[:lower:]')"
                if ! curl -fsSL "${ZONE_URL}/${lc}-aggregated.zone" -o "${tmp}/${lc}.zone"; then
                  echo "warn: could not fetch zone for ${cc}, skipping" >&2
                  continue
                fi
                while read -r cidr; do
                  [ -n "${cidr}" ] || continue
                  ipset add "${SET_NAME}-new" "${cidr}" -exist
                done < "${tmp}/${lc}.zone"
              done

              ipset create "${SET_NAME}" hash:net -exist
              ipset swap "${SET_NAME}-new" "${SET_NAME}"
              ipset destroy "${SET_NAME}-new"

              # INPUT covers host-local listeners; DOCKER-USER covers published
              # container ports, which bypass INPUT entirely.
              for chain in INPUT DOCKER-USER; do
                iptables -L "${chain}" -n >/dev/null 2>&1 || continue
                iptables -C "${chain}" -m set --match-set "${SET_NAME}" src -j DROP 2>/dev/null \
                  || iptables -I "${chain}" 1 -m set --match-set "${SET_NAME}" src -j DROP
              done

        - name: geo-block | Install reboot cron job
          ansible.builtin.cron:
            name: geo-block country blocks
            special_time: reboot
            job: "{{ geoblock_dir }}/update-country-blocks.sh"
            user: root
            state: present

        - name: geo-block | Apply country blocks
          ansible.builtin.command: "{{ geoblock_dir }}/update-country-blocks.sh"
          changed_when: false
          when: not ansible_check_mode

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "=== Bootstrap complete ==="
          - "VPS IP      : {{ inventory_hostname }}"
          - "SSH port    : {{ host_ssh_port }}"
          - "doco-cd UI  : https://doco.{{ towonel_base_domain }}"

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart ssh.socket
      ansible.builtin.service:
        name: ssh.socket
        state: restarted
