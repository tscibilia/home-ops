---
- name: Bootstrap towonel VPS
  hosts: all
  gather_facts: false
  # ubuntu is passwordless by design and has no NOPASSWD drop-in, so sudo
  # cannot escalate. root has a password, so su can. Runs prompt for it.
  become_method: ansible.builtin.su
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: auto_silent
    host_ssh_port: 22222
    dococd_config_dir: /opt/doco-cd
    geoblock_dir: /opt/geo-block

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping:

    - name: Read secrets from aKeyless
      ansible.builtin.shell: "akeyless get-secret-value --name '{{ item }}'"
      delegate_to: localhost
      loop:
        - docker/doco-cd/github-token
        - docker/doco-cd/akeyless-access-id
        - docker/doco-cd/akeyless-access-key
        - docker/secret-domain
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_github_token: "{{ secrets_raw.results[0].stdout }}"
        doco_akeyless_access_id: "{{ secrets_raw.results[1].stdout }}"
        doco_akeyless_access_key: "{{ secrets_raw.results[2].stdout }}"
        towonel_base_domain: "{{ secrets_raw.results[3].stdout }}"
      no_log: true

    - name: user
      become: true
      when: bootstrap_mode | default(false) | bool
      tags: user
      block:
        - name: user | Create ubuntu user
          ansible.builtin.user:
            name: ubuntu
            groups: sudo
            shell: /bin/bash
            create_home: true

        - name: user | Add SSH public key
          ansible.posix.authorized_key:
            user: ubuntu
            key: "{{ lookup('file', '~/.ssh/home-ops.pub') }}"

    - name: packages
      become: true
      when: bootstrap_mode | default(false) | bool
      tags: packages
      block:
        - name: packages | Install Docker
          ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
          args:
            executable: /bin/bash
            creates: /usr/bin/docker

        - name: packages | Add ubuntu to docker group
          ansible.builtin.user:
            name: ubuntu
            groups: docker
            append: true

    - name: ssh
      become: true
      when: bootstrap_mode | default(false) | bool
      tags: ssh
      block:
        - name: ssh | Update SSH socket port
          ansible.builtin.replace:
            path: /lib/systemd/system/ssh.socket
            regexp: "^(ListenStream=.+):\\d+$"
            replace: "\\1:{{ host_ssh_port }}"
          notify:
            - Reload systemd daemon
            - Restart ssh.socket

        - name: ssh | Harden sshd_config
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/01-hardening.conf
            content: |
              PermitRootLogin no
              PasswordAuthentication no
              MaxAuthTries 3
              LoginGraceTime 20
            owner: root
            mode: "0644"
          notify: Restart ssh.socket

    - name: firewall
      become: true
      tags: firewall
      block:
        - name: firewall | Allow ports
          community.general.ufw:
            rule: allow
            port: "{{ item.port }}"
            proto: "{{ item.protocol | default('tcp') }}"
          loop:
            - name: SSH hardened
              port: "{{ host_ssh_port }}"
            - name: HTTPS (caddy-l4)
              port: "443"
            - name: towonel hub API
              port: "8443"
            - name: towonel edge iroh
              port: "51820"
              protocol: udp

        # Needs `-e unifi_host=true`.
        - name: firewall | Allow UniFi controller UI
          community.general.ufw:
            rule: allow
            port: "4443"
            proto: tcp
          when: unifi_host | default(false) | bool

        # Bootstrap needs 22 to move sshd; every later run removes it.
        - name: firewall | Allow original SSH port during bootstrap
          community.general.ufw:
            rule: allow
            port: "22"
            proto: tcp
          when: bootstrap_mode | default(false) | bool

        - name: firewall | Remove original SSH port allow
          community.general.ufw:
            rule: allow
            port: "22"
            proto: tcp
            delete: true
          when: not (bootstrap_mode | default(false) | bool)

        - name: firewall | Enable UFW
          community.general.ufw:
            state: enabled
            policy: deny

    - name: network
      become: false
      tags: network
      block:
        - name: network | Create edge Docker network
          community.docker.docker_network:
            name: edge
            driver: bridge
            state: present

    - name: towonel
      become: true
      tags: towonel
      block:
        - name: towonel | Create data directory
          ansible.builtin.file:
            path: /opt/towonel
            state: directory
            owner: "10001"
            group: "10001"
            mode: "0755"

    - name: doco-cd
      become: false
      tags: doco-cd
      block:
        - name: doco-cd | Create config directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0755"

        - name: doco-cd | Copy docker-compose app file
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/docker-compose.app.yaml
            dest: "{{ dococd_config_dir }}/docker-compose.app.yaml"
            owner: ubuntu
            group: ubuntu
            mode: "0644"

        - name: doco-cd | Copy Dockerfile
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/Dockerfile
            dest: "{{ dococd_config_dir }}/Dockerfile"
            owner: ubuntu
            group: ubuntu
            mode: "0644"

        - name: doco-cd | Copy proxy.py
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/proxy.py
            dest: "{{ dococd_config_dir }}/proxy.py"
            owner: ubuntu
            group: ubuntu
            mode: "0644"

        - name: doco-cd | Copy cron-update.sh
          ansible.builtin.copy:
            src: ../../docker/vps/.doco-cd/cron-update.sh
            dest: "{{ dococd_config_dir }}/cron-update.sh"
            owner: ubuntu
            group: ubuntu
            mode: "0755"

        - name: doco-cd | Install nightly update cron job
          ansible.builtin.cron:
            name: doco-cd stack update
            minute: "0"
            hour: "3"
            job: "{{ dococd_config_dir }}/cron-update.sh"
            user: ubuntu
            state: present

        - name: doco-cd | Create secret files
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: "{{ item.content }}"
            owner: ubuntu
            group: ubuntu
            mode: "0600"
          no_log: true
          loop:
            - name: gh_token
              content: "{{ doco_github_token }}"
            - name: akeyless_access_id
              content: "{{ doco_akeyless_access_id }}"
            - name: akeyless_access_key
              content: "{{ doco_akeyless_access_key }}"

        - name: doco-cd | Run docker-compose
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            files:
              - docker-compose.app.yaml
            # Not `always`: rebuilding orphans the running image and the
            # next run fails with "No such image".
            build: policy
            pull: always
            state: present
          when: not ansible_check_mode

        - name: doco-cd | Wait for akeyless-proxy healthy
          community.docker.docker_container_info:
            name: akeyless-proxy
          register: proxy_info
          until: proxy_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 5
          when: not ansible_check_mode

        - name: doco-cd | Wait for doco-cd healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

    - name: geo-block
      become: true
      tags: geo-block
      vars:
        blocked_countries: [RU, IL, IR, CN, KP, BY]
      block:
        - name: geo-block | Install ipset
          ansible.builtin.apt:
            name: ipset
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: geo-block | Create script directory
          ansible.builtin.file:
            path: "{{ geoblock_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: geo-block | Install update-country-blocks.sh
          ansible.builtin.template:
            src: update-country-blocks.sh.j2
            dest: "{{ geoblock_dir }}/update-country-blocks.sh"
            owner: root
            group: root
            mode: "0755"

        - name: geo-block | Apply country blocks
          ansible.builtin.command:
            cmd: >-
              {{ geoblock_dir }}/update-country-blocks.sh
              "{{ blocked_countries | join(' ') }}"
            # Sentinel written only on success. Not zones/ -- the script
            # mkdirs that before downloading anything.
            creates: "{{ geoblock_dir }}/.last-success"

        - name: geo-block | Install weekly refresh cron job
          ansible.builtin.cron:
            name: GeoIP country block weekly refresh
            minute: "0"
            hour: "3"
            weekday: "0"
            job: >-
              {{ geoblock_dir }}/update-country-blocks.sh
              "{{ blocked_countries | join(' ') }}" >> /var/log/geo-block.log 2>&1
            user: root
            state: present

        - name: geo-block | Install reboot cron job
          ansible.builtin.cron:
            name: geo-block country blocks
            special_time: reboot
            job: >-
              {{ geoblock_dir }}/update-country-blocks.sh
              "{{ blocked_countries | join(' ') }}" >> /var/log/geo-block.log 2>&1
            user: root
            state: present

    - name: crowdsec
      become: true
      tags: crowdsec
      block:
        - name: crowdsec | Read bouncer key from aKeyless
          ansible.builtin.shell: "akeyless get-secret-value --name 'docker/vps-crowdsec/bouncer-api-key'"
          delegate_to: localhost
          become: false
          check_mode: false
          changed_when: false
          no_log: true
          register: crowdsec_secret_raw

        - name: crowdsec | Set bouncer key fact
          ansible.builtin.set_fact:
            crowdsec_bouncer_api_key: "{{ crowdsec_secret_raw.stdout }}"
          no_log: true

        - name: crowdsec | Create data directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - /opt/crowdsec/config
            - /opt/crowdsec/data

        - name: crowdsec | Create apt keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: crowdsec | Add apt signing key
          ansible.builtin.get_url:
            url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
            dest: /etc/apt/keyrings/crowdsec.asc
            owner: root
            group: root
            mode: "0644"

        # deb822_repository writes crowdsec.sources; the older apt_repository
        # wrote crowdsec.list. Leaving both defines the repo twice.
        - name: crowdsec | Remove legacy one-line apt repository
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/crowdsec.list
            state: absent

        - name: crowdsec | Add apt repository
          ansible.builtin.deb822_repository:
            name: crowdsec
            types: deb
            uris: https://packagecloud.io/crowdsec/crowdsec/any
            suites: any
            components: main
            signed_by: /etc/apt/keyrings/crowdsec.asc
            enabled: true
            state: present

        # Only the bouncer is a host package. The engine runs as a container
        # in 03-crowdsec; the bouncer must be on the host to write iptables.
        - name: crowdsec | Install host firewall bouncer
          ansible.builtin.apt:
            name: crowdsec-firewall-bouncer-iptables
            state: present
            update_cache: true

        - name: crowdsec | Render bouncer config
          ansible.builtin.template:
            src: crowdsec-firewall-bouncer.yaml.j2
            dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
            owner: root
            group: root
            mode: "0600"
          no_log: true
          notify: Restart crowdsec-firewall-bouncer

        # doco-cd deploys the engine on its own poll cycle, so on a first
        # bootstrap the container may not exist yet. Registration is skipped
        # rather than failed; re-run this tag once the stack is up.
        - name: crowdsec | Check the engine container is running
          ansible.builtin.command: docker ps --filter name=^crowdsec$ --format '{{ '{{' }}.Names{{ '}}' }}'
          register: crowdsec_engine
          changed_when: false
          failed_when: false

        # cscli pretty-prints JSON as `"name": "firewall"` with a space, so an
        # exact-string grep never matches and this re-runs `add` every time,
        # failing once the bouncer exists. Match either spacing.
        #
        # Rotating the key needs `cscli bouncers delete firewall` first --
        # this only checks that the name exists, not which key it holds.
        - name: crowdsec | Register firewall bouncer (idempotent)
          ansible.builtin.shell: |
            set -e
            if docker exec crowdsec cscli bouncers list -o json | grep -qE '"name":[[:space:]]*"firewall"'; then
              echo "ALREADY_REGISTERED"
            else
              docker exec crowdsec cscli bouncers add firewall --key "{{ crowdsec_bouncer_api_key }}"
            fi
          register: crowdsec_bouncer_reg
          changed_when: "'ALREADY_REGISTERED' not in crowdsec_bouncer_reg.stdout"
          no_log: true
          when: "'crowdsec' in crowdsec_engine.stdout"

    # Needs `-e unifi_host=true`.
    - name: unfbkup
      when: unifi_host | default(false) | bool
      tags: unfbkup
      block:
        - name: unfbkup | Read restic secrets from aKeyless
          ansible.builtin.shell: "akeyless get-secret-value --name '{{ item }}'"
          delegate_to: localhost
          loop:
            - docker/vps-unifi/restic-repository
            - docker/vps-unifi/restic-password
            - docker/vps-unifi/b2-account-id
            - docker/vps-unifi/b2-account-key
          check_mode: false
          changed_when: false
          no_log: true
          register: restic_secrets_raw

        - name: unfbkup | Set restic secret facts
          ansible.builtin.set_fact:
            restic_repository: "{{ restic_secrets_raw.results[0].stdout }}"
            restic_password: "{{ restic_secrets_raw.results[1].stdout }}"
            b2_account_id: "{{ restic_secrets_raw.results[2].stdout }}"
            b2_account_key: "{{ restic_secrets_raw.results[3].stdout }}"
          no_log: true

        - name: unfbkup | Initialize restic B2 repository (idempotent)
          ansible.builtin.shell: |
            docker run --rm \
              -e RESTIC_REPOSITORY="{{ restic_repository }}" \
              -e RESTIC_PASSWORD="{{ restic_password }}" \
              -e B2_ACCOUNT_ID="{{ b2_account_id }}" \
              -e B2_ACCOUNT_KEY="{{ b2_account_key }}" \
              docker.io/restic/restic:0.17.3@sha256:80361423ec2beca5646ff0a94aed3f28ac9ad7a6742fb24f66e617359b9754ce init
          register: restic_init
          failed_when:
            - restic_init.rc != 0
            - "'already initialized' not in restic_init.stderr"
            - "'config file already exists' not in restic_init.stderr"
          changed_when: restic_init.rc == 0
          no_log: true

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "=== Bootstrap complete ==="
          - "VPS IP      : {{ inventory_hostname }}"
          - "SSH port    : {{ host_ssh_port }}"
          - "doco-cd UI  : https://doco.{{ towonel_base_domain }}"

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart ssh.socket
      ansible.builtin.service:
        name: ssh.socket
        state: restarted

    # Type=notify, and the bouncer only signals ready after it reconciles every
    # decision into ipset -- tens of thousands after a CAPI pull. That overruns
    # systemctl's D-Bus call timeout, so a blocking restart reports "Connection
    # timed out" while the job is still succeeding. Start it detached, then
    # poll for the result.
    - name: Restart crowdsec-firewall-bouncer
      ansible.builtin.shell: |
        set -e
        systemctl restart --no-block crowdsec-firewall-bouncer
        for _ in $(seq 1 24); do
          if [ "$(systemctl is-active crowdsec-firewall-bouncer)" = "active" ]; then
            exit 0
          fi
          sleep 5
        done
        systemctl status crowdsec-firewall-bouncer --no-pager -l || true
        exit 1
      changed_when: true
