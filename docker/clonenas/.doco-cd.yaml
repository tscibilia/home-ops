working_dir: ./docker/clonenas
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  # Must be plain text secrets (not JSON)
  NUT_MONITOR_PASSWORD:
    store_ref: akeyless
    remote_ref:
      key: /docker/clonenas/nut-monitor-password
force_recreate: false
reconciliation:
  enabled: true
  events: ["unhealthy", "die"]

---
# doco-cd's own stack (issue #4321). working_dir is relative to the repository
# root, not to DEPLOY_CONFIG_BASE_DIR. name must equal the Compose project name,
# or the deploy creates a second doco-cd beside the running one.
name: doco-cd
working_dir: ./docker/clonenas/.doco-cd
compose_files: [doco-cd.compose.yaml]
timeout: 120
