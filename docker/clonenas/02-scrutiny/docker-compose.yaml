version: "3.8"

services:
  scrutiny-collector:
    image: ghcr.io/analogj/scrutiny:v0.10.0-collector@sha256:372493d3edf473571b806efb5922e8868537af644b3817536695cae05abd4f2c
    container_name: scrutiny-collector
    restart: unless-stopped
    networks:
      - doco-cd
    cap_add:
      - SYS_RAWIO # required for smartctl SMART queries
      - SYS_ADMIN # required for NVMe (/dev/nvme0)
    volumes:
      - /dev:/dev # bind-mount avoids runc cgroup "p" type error on TrueNAS kernel
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - "b 8:* r" # /dev/sda+ (SATA/SAS, major 8)
    environment:
      COLLECTOR_API_ENDPOINT: http://scrutiny.internal
      COLLECTOR_HOST_ID: clonenas

networks:
  doco-cd:
    external: true
