version: "3.8"

services:
  scrutiny-collector:
    image: ghcr.io/analogj/scrutiny:v0.9.3-collector@sha256:9e3413b1992eee55cd4138a2e5b9083ce47f6f3ffce7d1c1eb17995c05728b3e
    container_name: scrutiny-collector
    restart: unless-stopped
    networks:
      - doco-cd
    cap_add:
      - SYS_RAWIO # required for smartctl SMART queries
      - SYS_ADMIN # required for NVMe (/dev/nvme0)
    volumes:
      - /dev:/dev # bind-mount avoids runc cgroup "p" type error on TrueNAS kernel
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - "b 8:* r" # /dev/sda+ (SATA/SAS, major 8)
    environment:
      COLLECTOR_API_ENDPOINT: http://scrutiny.internal:8080
      COLLECTOR_HOST_ID: clonenas

networks:
  doco-cd:
    external: true
