---
name: observability
services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --no-collector.edac
    volumes:
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:5.1
    container_name: fluent-bit
    restart: unless-stopped
    network_mode: host
    hostname: vps
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/conf/fluent-bit.conf"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-data:/fluent-bit/data
    configs:
      - source: fluent_bit_config
        target: /fluent-bit/etc/conf/fluent-bit.conf
      - source: fluent_bit_enrich
        target: /fluent-bit/etc/conf/enrich.lua

  prometheus-agent:
    image: quay.io/prometheus/prometheus:v3.14.0
    container_name: prometheus-agent
    restart: unless-stopped
    network_mode: host
    # Host docker group, for read-only docker.sock (the `docker` scrape job).
    group_add:
      - "988"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --agent
      - --storage.agent.path=/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_scrape_configs
        target: /etc/prometheus/scrape_configs.yml
    volumes:
      - prometheus-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  fluent-bit-data:
  prometheus-data:

configs:
  # doco-cd force-recreates on changed config *files* but skips inline
  # `content` — so only what needs ${VAR} interpolation stays inline.
  prometheus_config:
    content: |
      global:
        scrape_interval: 1m
        scrape_timeout: 30s

      scrape_config_files:
        - /etc/prometheus/scrape_configs.yml

      remote_write:
        - url: https://prometheus-rw.${DOMAIN}/api/v1/write
          basic_auth:
            username: ${PROMETHEUS_USERNAME}
            password: ${PROMETHEUS_PASSWORD}

  prometheus_scrape_configs:
    file: ./config/scrape_configs.yml
  fluent_bit_config:
    file: ./config/fluent-bit.conf
  fluent_bit_enrich:
    file: ./config/enrich.lua
