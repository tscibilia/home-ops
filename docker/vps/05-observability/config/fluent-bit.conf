[SERVICE]
    Daemon Off
    Flush 5
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name tail
    Path /var/lib/docker/containers/*/*-json.log
    Parser docker
    Tag docker
    Path_Key filename
    Refresh_Interval 5
    Mem_Buf_Limit 10MB
    Skip_Long_Lines On
    DB /fluent-bit/data/docker.db

[FILTER]
    Name lua
    Match docker
    Script /fluent-bit/etc/conf/enrich.lua
    call enrich_container_name

# Benign lines that are logged at error level anyway: logback's startup
# level announcements, and caddy/akeyless client disconnects.
# Keep `write:` — doco-cd's real aKeyless failures are `read:`.
[FILTER]
    Name grep
    Match docker
    Exclude log (?i)error:\s*none
    Exclude log \|-INFO in ch\.qos\.logback
    Exclude log Setting level of logger
    Exclude log BrokenPipeError
    Exclude log "msg":"matching connection"
    Exclude log write: (connection reset by peer|broken pipe)

# Match the level marker, never a bare "error" substring — (?i)error also
# matches prose like "Broken pipe (os error 32)" on a WARN line.
# Formats: JSON / logfmt / mongo / uppercase word / python exception.
[FILTER]
    Name log_to_metrics
    Match docker
    Tag node_metrics
    Metric_Name container_log_errors_total
    metric_mode counter
    metric_description Container log error count
    regex log ("level":"(error|ERROR|fatal|FATAL)"|level=(error|fatal)|"s":"[EF]"|\b(ERROR|FATAL|SEVERE)\b|^[A-Za-z_][A-Za-z0-9_.]*(Error|Exception):)
    Label_Field container
    Label_Field host

[FILTER]
    Name log_to_metrics
    Match docker
    Tag node_metrics
    Metric_Name container_log_warnings_total
    metric_mode counter
    metric_description Container log warning count
    regex log ("level":"(warn|WARN|warning|WARNING)"|level=warn(ing)?|"s":"W"|\b(WARN|WARNING)\b)
    Label_Field container
    Label_Field host

[OUTPUT]
    Name prometheus_exporter
    Match node_metrics
    Host 0.0.0.0
    Port 2020

[OUTPUT]
    Name null
    Match docker
