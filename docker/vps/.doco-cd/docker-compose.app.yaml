---
# This file is not managed by doco-cd because it can't manage itself.

secrets:
  gh_token:
    file: /opt/doco-cd/gh_token
  akeyless_access_id:
    file: /opt/doco-cd/akeyless_access_id
  akeyless_access_key:
    file: /opt/doco-cd/akeyless_access_key

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.114.0
    container_name: doco-cd
    restart: unless-stopped
    depends_on:
      akeyless-proxy:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - data:/data
    # Metrics are served on 9120 but no port is published, so the prometheus
    # agent reaches them over the `edge` bridge via docker service discovery.
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9120"
      prometheus.job: "doco-cd"
    environment:
      LOG_LEVEL: info
      DEPLOY_CONFIG_BASE_DIR: ./docker/vps/
      POLL_CONFIG: |-
        - url: https://github.com/tscibilia/home-ops.git
          reference: refs/heads/main
          interval: 3600
      SECRET_PROVIDER: webhook
      SECRET_PROVIDER_WEBHOOK_STORES: |
        name: akeyless
        version: v1
        url: "http://akeyless-proxy:8080/secret?name={{ .remote_ref.key | urlencode }}"
        method: GET
        json_path: "values(@)[0]"
      TZ: America/New_York
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    secrets:
      - gh_token

  akeyless-proxy:
    image: ghcr.io/tscibilia/akeyless-proxy:0.0.1@sha256:1da58e8c7d5475a51bf1a8c7ed3877bb513fcca6b2b4b7c4e4dc4214e0ed2cde
    container_name: akeyless-proxy
    restart: unless-stopped
    # The image runs as `nobody`. Compose bind-mounts the secret files with
    # their host permissions (0600 ubuntu:ubuntu), so the container must run
    # as the host user that owns them or it exits on PermissionError.
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      AKEYLESS_ACCESS_ID_FILE: /run/secrets/akeyless_access_id
      AKEYLESS_ACCESS_KEY_FILE: /run/secrets/akeyless_access_key
      # This host resolves ~20 secrets per deploy; without connection reuse the
      # burst overflows the listen backlog. See akeyless-proxy ADR-0003.
      PROXY_KEEPALIVE: "1"
    secrets:
      - akeyless_access_id
      - akeyless_access_key

networks:
  default:
    name: edge
    external: true

volumes:
  data: {}
