name: unfbkup

services:
  ofelia:
    image: docker.io/mcuadros/ofelia:0.3.23@sha256:0d592a61d83908a0ae4eabcf5b0b0009237342aa5d138f324e5540c7b5160ad1
    container_name: ofelia
    restart: unless-stopped
    command: daemon --docker
    depends_on:
      - unifi-backup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  unifi-backup:
    image: docker.io/restic/restic:0.19.1@sha256:08916bcda4a4435f9d9828ebb4e91bb7ada3d2c8a53699788930e0ae1bd4fa67
    container_name: unifi-backup
    restart: unless-stopped
    entrypoint: /bin/sh
    command: ["-c", "sleep infinity"]
    volumes:
      - /opt/unifi/config:/config:ro
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY}
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup.schedule: "0 0 3 * * *"
      ofelia.job-exec.backup.command: "sh -c 'restic backup /config && restic forget --keep-daily 7 --keep-weekly 4 --prune'"

networks:
  default:
    name: edge
    external: true
