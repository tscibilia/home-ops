---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    # `labeled` fires on every Renovate type/* label too; the action treats those
    # as a no-op, so filter them here rather than burn a runner slot on them.
    if: >-
      ${{ github.event.pull_request.user.login == 'kube-skywalker[bot]'
      && !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'ai-review') }}
    runs-on: ${{ github.event.repository.name }}-runner
    # Backstop only — must exceed the action's own budgets, or a long review is
    # killed with nothing published. Worst case is the tool loop (600s) + primary
    # review (2 attempts × 300s) + fallback (2 attempts × 300s, a fixed budget
    # the action does not expose) = 30m, plus checkout and preflight. Every
    # *_timeout_sec and ai-primary-retries change below has to be re-checked
    # against this number.
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, consumed by the aKeyless jwt auth method
      pull-requests: write
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: akeyless-community/akeyless-github-action@3e757afc76104f97c7d0203d92d774d4722032e8 # v1.1.9
        with:
          access-id: ${{ vars.AKEYLESS_ACCESS_ID }}
          access-type: jwt
          static-secrets: |
            - name: "/ai/litellm"
              output-name: "LITELLM_API_KEY"
              key: "LITELLM_PRREVIEWER_AGENTKEY"
            - name: "/kubernetes/konflate"
              output-name: "KONFLATE_TOKEN"
              key: "KONFLATE_TOKEN"
            - name: "/kubernetes/cluster-secrets"
              output-name: "SECRET_DOMAIN"
              key: "SECRET_DOMAIN"

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preflight — required tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"

          missing=()
          for t in gh curl git python3 jq; do
            command -v "$t" >/dev/null 2>&1 || missing+=("$t")
          done

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "All required tools present."
            exit 0
          fi
          echo "Missing: ${missing[*]}"

          for t in "${missing[@]}"; do
            case "$t" in
              jq)
                arch=$(uname -m)
                case "$arch" in
                  x86_64) jqarch=amd64 ;;
                  aarch64) jqarch=arm64 ;;
                  *) echo "::error::unsupported arch for jq: $arch"; exit 1 ;;
                esac
                curl -fsSL -o "${HOME}/.local/bin/jq" \
                  "https://github.com/jqlang/jq/releases/latest/download/jq-linux-${jqarch}"
                chmod +x "${HOME}/.local/bin/jq"
                ;;
              *)
                echo "::error::${t} is missing and cannot be installed rootlessly here."
                echo "::error::Add it to the runner image, or run this job in a job container."
                exit 1
                ;;
            esac
          done

          for t in gh curl git python3 jq; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::${t} still missing"; exit 1; }
          done
          echo "Preflight OK."

      - name: AI PR Review
        uses: misospace/pr-reviewer-action@aa12ad9909b1ee8a5a7fe00dceeb1a8c97ab27dd # v3.1.0
        env:
          KONFLATE_MCP_URL: http://konflate.flux-system.svc.cluster.local:8080/mcp
          KONFLATE_PUBLIC_URL: https://konflate.${{ steps.load-secrets.outputs.SECRET_DOMAIN }}
          KONFLATE_MCP_TOKEN: ${{ steps.load-secrets.outputs.KONFLATE_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-approve: "true"
          # Exact host match, no subdomain or www fallback. Redirects are
          # re-validated per hop, so a bare domain that 301s to www needs both.
          allowed-source-hosts: github.com,api.github.com,raw.githubusercontent.com,gitlab.com,codeberg.org,registry.terraform.io,artifacthub.io,actualbudget.org,cloudnative-pg.io,postgresql.org,www.postgresql.org,fluxcd.io,docs.cilium.io,rook.io,external-secrets.io,gateway.envoyproxy.io,kubernetes.io,kubernetes-sigs.github.io,talos.dev,www.talos.dev,bjw-s.dev,grafana.com,docs.fluentbit.io,git.erwanleboucher.dev,hub.docker.com
          ai-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-api-format: openai
          ai-model: laguna-s-2-1
          ai-api-key: ${{ steps.load-secrets.outputs.LITELLM_API_KEY }}
          ai-max-tokens: "32768"
          ai-temperature: "0.1"
          # A healthy review finishes the whole job in 2–15m, so a single call
          # past 300s is hung, not slow. Retries were starving the fallback:
          # 3 × 600s alone overran the job timeout and nothing was published.
          # Total attempt count, not extra attempts on top of one: 2 × 300s = 10m.
          # v3's default is true (v2's was false). Left off for v2 parity: on, it
          # blocks the review until all other checks on the head SHA go terminal.
          # v3 self-excludes its own run, so it cannot wait on itself.
          ci-status-check: "false"
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "5"
          ai-connect-timeout-sec: "15"
          ai-request-timeout-sec: "300"
          ai-stream: "true"
          ai-fallback-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-fallback-api-format: openai
          ai-fallback-model: qwen-local
          ai-fallback-api-key: ${{ steps.load-secrets.outputs.LITELLM_API_KEY }}
          ai-fallback-request-timeout-sec: "300"
          ai-fallback-connect-timeout-sec: "15"
          review-verbosity: concise
          ai-response-format: json_schema
          verdict-policy: findings_severity_gated
          evidence-providers-file: .github/konflate-evidence.json
          inline-findings: "true"
          on-model-failure: fail
          required-check-validation-mode: warn
          # v3 has no CI gate by default in our parity set; see ci-status-check
          rereview-label: ai-review
          skip-if-diff-unchanged: "true"
          system-prompt-file: .agents/pr-review-instructions.md
          system-prompt-mode: append
          tool-mode: native_loop
          tool-max-requests: "16"
          tool-max-rounds: "5"
          tool-loop-summarize: "true"
          tool-loop-summarize-max-tokens: "512"
          tool-loop-wall-clock-sec: "600"
          tool-turn-timeout-sec: "120"
          tool-corpus-max-bytes: "100000"
          tool-max-tokens-per-turn: "32000"
          tool-request-timeout-sec: "60"
          tool-max-response-bytes: "32000"
          tool-allowed-gh-api-repos: "*"
          tool-enable-for-forks: "false"
          tool-mcp-servers: "tools=http://litellm.ai.svc.cluster.local:4000/mcp/,konflate=http://konflate.flux-system.svc.cluster.local:8080/mcp"
          tool-mcp-token: ${{ steps.load-secrets.outputs.LITELLM_API_KEY }}
          tool-mcp-name-prefixes: "github_mcp,searxng_mcp,victoria_logs_mcp,sidero_mcp,context7_mcp,talos_mcp"
          publish-review-comment: "true"
          publish-mode: review_verdict
          validate-required-checks: "auto"
