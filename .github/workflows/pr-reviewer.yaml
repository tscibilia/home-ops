---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    # `labeled` fires on every Renovate type/* label too; the action treats those
    # as a no-op, so filter them here rather than burn a runner slot on them.
    if: >-
      ${{ github.event.pull_request.user.login == 'kube-skywalker[bot]'
      && !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'ai-review') }}
    runs-on: ${{ github.event.repository.name }}-runner
    # Backstop only — must exceed the action's own budgets, or a long review is
    # killed with nothing published. Worst case is planning (120s) + tool loop
    # (600s) + primary review call (2 × 300s) + fallback call (2 × 300s, a
    # fixed budget the action does not expose) = 32m, plus checkout and
    # preflight. Every ai_*_timeout_sec and ai_primary_retries change below has
    # to be re-checked against this number.
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, consumed by the aKeyless jwt auth method
      pull-requests: write
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: akeyless-community/akeyless-github-action@3e757afc76104f97c7d0203d92d774d4722032e8 # v1.1.9
        with:
          access-id: ${{ vars.AKEYLESS_ACCESS_ID }}
          access-type: jwt
          static-secrets: |
            - name: "/ai/litellm"
              output-name: "LITELLM_API_KEY"
              key: "LITELLM_PRREVIEWER_AGENTKEY"
            - name: "/kubernetes/konflate"
              output-name: "KONFLATE_TOKEN"
              key: "KONFLATE_TOKEN"
            - name: "/kubernetes/cluster-secrets"
              output-name: "SECRET_DOMAIN"
              key: "SECRET_DOMAIN"

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preflight — required tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"

          missing=()
          for t in gh curl git python3 jq; do
            command -v "$t" >/dev/null 2>&1 || missing+=("$t")
          done

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "All required tools present."
            exit 0
          fi
          echo "Missing: ${missing[*]}"

          for t in "${missing[@]}"; do
            case "$t" in
              jq)
                arch=$(uname -m)
                case "$arch" in
                  x86_64) jqarch=amd64 ;;
                  aarch64) jqarch=arm64 ;;
                  *) echo "::error::unsupported arch for jq: $arch"; exit 1 ;;
                esac
                curl -fsSL -o "${HOME}/.local/bin/jq" \
                  "https://github.com/jqlang/jq/releases/latest/download/jq-linux-${jqarch}"
                chmod +x "${HOME}/.local/bin/jq"
                ;;
              *)
                echo "::error::${t} is missing and cannot be installed rootlessly here."
                echo "::error::Add it to the runner image, or run this job in a job container."
                exit 1
                ;;
            esac
          done

          for t in gh curl git python3 jq; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::${t} still missing"; exit 1; }
          done
          echo "Preflight OK."

      - name: AI PR Review
        uses: misospace/pr-reviewer-action@54dfb1aac20e1e410ad8f71dc3681b888500a1ec # v2.2.1
        env:
          KONFLATE_MCP_URL: http://konflate.flux-system.svc.cluster.local:8080/mcp
          KONFLATE_PUBLIC_URL: https://konflate.${{ steps.load-secrets.outputs.SECRET_DOMAIN }}
          KONFLATE_MCP_TOKEN: ${{ steps.load-secrets.outputs.KONFLATE_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_approve: "true"
          # Exact host match, no subdomain or www fallback. Redirects are
          # re-validated per hop, so a bare domain that 301s to www needs both.
          allowed_source_hosts: github.com,api.github.com,raw.githubusercontent.com,gitlab.com,codeberg.org,registry.terraform.io,artifacthub.io,actualbudget.org,cloudnative-pg.io,postgresql.org,www.postgresql.org,fluxcd.io,docs.cilium.io,rook.io,external-secrets.io,gateway.envoyproxy.io,kubernetes.io,kubernetes-sigs.github.io,talos.dev,www.talos.dev,bjw-s.dev,grafana.com,docs.fluentbit.io,git.erwanleboucher.dev,hub.docker.com
          ai_base_url: http://litellm.ai.svc.cluster.local:4000/v1
          ai_api_format: openai
          ai_model: laguna-s-2-1
          ai_api_key: ${{ steps.load-secrets.outputs.LITELLM_API_KEY }}
          ai_max_tokens: "32768"
          ai_temperature: "0.1"
          # A healthy review finishes the whole job in 2–15m, so a single call
          # past 300s is hung, not slow. Retries were starving the fallback:
          # 3 × 600s alone overran the job timeout and nothing was published.
          # This is a total attempt count, not extra attempts on top of one.
          ai_primary_retries: "2"
          ai_primary_retry_delay_sec: "5"
          ai_connect_timeout_sec: "15"
          ai_request_timeout_sec: "300"
          ai_stream: "true"
          ai_fallback_base_url: http://litellm.ai.svc.cluster.local:4000/v1
          ai_fallback_api_format: openai
          ai_fallback_model: qwen-local
          ai_fallback_api_key: ${{ steps.load-secrets.outputs.LITELLM_API_KEY }}
          ai_fallback_request_timeout_sec: "300"
          ai_fallback_connect_timeout_sec: "15"
          review_verbosity: concise
          ai_response_format: json_schema
          verdict_policy: findings_severity_gated
          evidence_providers_file: .github/konflate-evidence.json
          inline_findings: "true"
          on_model_failure: fail
          required_check_validation_mode: warn
          review_scope: auto
          rereview_label: ai-review
          skip_if_diff_unchanged: "true"
          system_prompt_file: .agents/pr-review-instructions.md
          system_prompt_mode: append
          tool_mode: native_loop
          tool_max_requests: "16"
          tool_max_rounds: "5"
          tool_loop_summarize: "true"
          tool_loop_summarize_max_tokens: "512"
          tool_loop_wall_clock_sec: "600"
          tool_request_timeout_sec: "60"
          tool_max_response_bytes: "32000"
          tool_planning_timeout_sec: "120"
          tool_planning_max_context_bytes: "100000"
          tool_planning_max_tokens: "32000"
          tool_allowed_gh_api_repos: "*"
          tool_enable_for_forks: "false"
          tool_mcp_servers: "tools=http://litellm.ai.svc.cluster.local:4000/mcp/,konflate=http://konflate.flux-system.svc.cluster.local:8080/mcp"
          tool_mcp_token: ${{ steps.load-secrets.outputs.LITELLM_API_KEY }}
          tool_mcp_name_prefixes: "github_mcp,searxng_mcp,victoria_logs_mcp,sidero_mcp,context7_mcp,talos_mcp"
          publish_review_comment: "true"
          publish_mode: review_verdict
          validate_required_checks: "auto"
