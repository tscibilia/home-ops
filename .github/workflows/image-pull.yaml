---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  extract:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, consumed by the aKeyless jwt auth method
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: akeyless-community/akeyless-github-action@3e757afc76104f97c7d0203d92d774d4722032e8 # v1.1.9
        with:
          access-id: ${{ vars.AKEYLESS_ACCESS_ID }}
          access-type: jwt
          static-secrets: |
            - name: "/kubernetes/ocharted"
              output-name: "OCHARTED_USERNAME"
              key: "OCHARTED_USERNAME"
            - name: "/kubernetes/ocharted"
              output-name: "OCHARTED_PASSWORD"
              key: "OCHARTED_PASSWORD"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise - Flate
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          tool_versions: |
            github:home-operations/flate 0.4.8

      - name: Setup Registry Auth
        env:
          OCHARTED_USERNAME: ${{ steps.load-secrets.outputs.OCHARTED_USERNAME }}
          OCHARTED_PASSWORD: ${{ steps.load-secrets.outputs.OCHARTED_PASSWORD }}
        run: |
          host="$(grep -rhoE 'oci://ocharted\.[^/]+' ./kubernetes/apps | sed 's|oci://||' | sort -u | head -1)"
          if [[ -z "$host" ]]; then echo "No ocharted host found in OCIRepository urls" && exit 1; fi
          mkdir -p "$(dirname "$FLATE_REGISTRY_CONFIG")"
          umask 077
          jq -n --arg host "$host" \
            --arg auth "$(printf '%s:%s' "$OCHARTED_USERNAME" "$OCHARTED_PASSWORD" | base64 -w0)" \
            '{auths: {($host): {auth: $auth}}}' > "$FLATE_REGISTRY_CONFIG"

      - name: Extract Images
        id: extract
        run: |
          images="$(flate diff images -p ./kubernetes/flux/cluster -o json)"
          printf 'images<<EOF\n%s\nEOF\n' "$images" >> "$GITHUB_OUTPUT"

  pull:
    if: ${{ needs.extract.outputs.images != '[]' }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise - Talos
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          tool_versions: |
            talosctl latest

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
        run: timeout 120 talosctl --nodes "$NODE" image pull "$IMAGE"

  success:
    if: ${{ !cancelled() }}
    needs: pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
