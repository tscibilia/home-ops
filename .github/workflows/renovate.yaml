---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches: ["main"]
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  schedule:
    - cron: 20 * * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC token, consumed by the aKeyless jwt auth method
      packages: read
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: akeyless-community/akeyless-github-action@3e757afc76104f97c7d0203d92d774d4722032e8 # v1.1.9
        with:
          access-id: ${{ vars.AKEYLESS_ACCESS_ID }}
          access-type: jwt
          static-secrets: |
            - name: "/kubernetes/actions-runner"
              output-name: "BOT_APP_ID"
              key: "ACTIONS_RUNNER_APP_ID"
            - name: "/kubernetes/actions-runner"
              output-name: "BOT_APP_PRIVATE_KEY"
              key: "ACTIONS_RUNNER_PRIVATE_KEY"
            - name: "/kubernetes/ocharted"
              output-name: "OCHARTED_USERNAME"
              key: "OCHARTED_USERNAME"
            - name: "/kubernetes/ocharted"
              output-name: "OCHARTED_PASSWORD"
              key: "OCHARTED_PASSWORD"
            - name: "/kubernetes/github"
              output-name: "GHCR_TOKEN"
              key: "GHCR_TOKEN"
            - name: "/kubernetes/cluster-secrets"
              output-name: "SECRET_DOMAIN"
              key: "SECRET_DOMAIN"

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.BOT_APP_ID }}
          private-key: ${{ steps.load-secrets.outputs.BOT_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_SECRETS: |-
            {
              "OCHARTED_USERNAME": "${{ steps.load-secrets.outputs.OCHARTED_USERNAME }}",
              "OCHARTED_PASSWORD": "${{ steps.load-secrets.outputs.OCHARTED_PASSWORD }}"
            }
          RENOVATE_HOST_RULES: |
            [
              {"hostType": "docker", "matchHost": "ghcr.io", "username": "${{ github.repository_owner }}", "password": "${{ steps.load-secrets.outputs.GHCR_TOKEN }}"},
              {"hostType": "docker", "matchHost": "ocharted.${{ steps.load-secrets.outputs.SECRET_DOMAIN }}", "username": "{{ secrets.OCHARTED_USERNAME }}", "password": "{{ secrets.OCHARTED_PASSWORD }}"}
            ]
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ inputs.version || 'latest' }}
